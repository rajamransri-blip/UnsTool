name: Setup Project and Build APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Cache Gradle
        uses: actions/cache@v3
        with:
          path: ~/.gradle/caches
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*') }}
          restore-keys: ${{ runner.os }}-gradle-

      - name: Cache NDK
        uses: actions/cache@v3
        with:
          path: ${{ env.ANDROID_HOME }}/ndk/26.1.10909125
          key: ndk-26.1.10909125

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.5'

      - name: Generate Full Source Tree with bgmi.csv Manifest
        run: |
          mkdir -p app/src/main/cpp
          mkdir -p app/src/main/python
          mkdir -p app/src/main/java/com/upstool/paktool
          mkdir -p app/src/main/res/values
          mkdir -p app/src/main/assets

          # ========== gradle.properties ==========
          cat << 'EOF' > gradle.properties
          org.gradle.jvmargs=-Xmx3072m -Dfile.encoding=UTF-8
          android.useAndroidX=true
          android.nonTransitiveRClass=true
          kotlin.code.style=official
          EOF

          # ========== settings.gradle ==========
          cat << 'EOF' > settings.gradle
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
                  maven { url "https://chaquo.com/maven" }
              }
          }
          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.PREFER_SETTINGS)
              repositories {
                  google()
                  mavenCentral()
                  maven { url "https://chaquo.com/maven" }
              }
          }
          rootProject.name = "Upstool"
          include ':app'
          EOF

          # ========== build.gradle (root) ==========
          cat << 'EOF' > build.gradle
          buildscript {
              repositories {
                  google()
                  mavenCentral()
                  maven { url "https://chaquo.com/maven" }
              }
              dependencies {
                  classpath "com.android.tools.build:gradle:8.2.2"
                  classpath "org.jetbrains.kotlin:kotlin-gradle-plugin:1.9.22"
                  classpath "com.chaquo.python:gradle:15.0.1"
              }
          }
          EOF

          # ========== app/build.gradle ==========
          cat << 'EOF' > app/build.gradle
          apply plugin: 'com.android.application'
          apply plugin: 'org.jetbrains.kotlin.android'
          apply plugin: 'com.chaquo.python'

          android {
              namespace 'com.upstool.paktool'
              compileSdk 34

              defaultConfig {
                  applicationId "com.upstool.paktool"
                  minSdk 24
                  targetSdk 34
                  versionCode 1
                  versionName "1.0.0"

                  ndk {
                      abiFilters "arm64-v8a", "armeabi-v7a"
                  }

                  python {
                      version "3.10"
                      pip {
                          install "pycryptodome"
                          install "zstandard"
                      }
                  }

                  externalNativeBuild {
                      cmake {
                          cppFlags "-std=c++17"
                          arguments "-DANDROID_STL=c++_shared"
                      }
                  }
              }

              buildTypes {
                  release {
                      minifyEnabled false
                      proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
                  }
              }

              compileOptions {
                  sourceCompatibility JavaVersion.VERSION_17
                  targetCompatibility JavaVersion.VERSION_17
              }

              kotlinOptions {
                  jvmTarget = '17'
              }

              buildFeatures {
                  compose true
              }

              composeOptions {
                  kotlinCompilerExtensionVersion '1.5.8'
              }

              externalNativeBuild {
                  cmake {
                      path file('src/main/cpp/CMakeLists.txt')
                      version '3.22.1'
                  }
              }

              ndkVersion '26.1.10909125'
          }

          dependencies {
              def composeBom = platform('androidx.compose:compose-bom:2024.02.00')
              implementation composeBom
              implementation 'androidx.core:core-ktx:1.12.0'
              implementation 'androidx.lifecycle:lifecycle-runtime-ktx:2.7.0'
              implementation 'androidx.activity:activity-compose:1.8.2'
              implementation 'androidx.lifecycle:lifecycle-viewmodel-compose:2.7.0'
              implementation 'androidx.compose.ui:ui'
              implementation 'androidx.compose.ui:ui-graphics'
              implementation 'androidx.compose.material3:material3'
              implementation 'androidx.compose.material:material-icons-extended'
              implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-android:1.7.3'
          }
          EOF

          touch app/proguard-rules.pro

          # ========== strings.xml ==========
          cat << 'EOF' > app/src/main/res/values/strings.xml
          <resources>
              <string name="app_name">Upstool</string>
          </resources>
          EOF

          # ========== AndroidManifest.xml ==========
          cat << 'EOF' > app/src/main/AndroidManifest.xml
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android"
              xmlns:tools="http://schemas.android.com/tools">

              <uses-permission android:name="android.permission.READ_EXTERNAL_STORAGE" />
              <uses-permission android:name="android.permission.WRITE_EXTERNAL_STORAGE" />
              <uses-permission
                  android:name="android.permission.MANAGE_EXTERNAL_STORAGE"
                  tools:ignore="ScopedStorage" />

              <application
                  android:allowBackup="true"
                  android:label="@string/app_name"
                  android:requestLegacyExternalStorage="true"
                  android:supportsRtl="true"
                  android:theme="@android:style/Theme.Material.NoActionBar">
                  <activity
                      android:name=".MainActivity"
                      android:exported="true"
                      android:windowSoftInputMode="adjustResize">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>
              </application>
          </manifest>
          EOF

          # ========== CMakeLists.txt ==========
          cat << 'EOF' > app/src/main/cpp/CMakeLists.txt
          cmake_minimum_required(VERSION 3.22.1)
          project("upstool_native")
          set(CMAKE_CXX_STANDARD 17)
          add_library(upstool_native SHARED pak_engine.cpp)
          find_library(log-lib log)
          find_library(android-lib android)
          target_link_libraries(upstool_native ${log-lib} ${android-lib} z)
          EOF

          # ========== pak_engine.cpp (Fixed Variable Typo) ==========
          cat << 'EOF' > app/src/main/cpp/pak_engine.cpp
          #include <jni.h>
          #include <string>
          #include <vector>
          #include <fstream>
          #include <filesystem>
          #include <sstream>
          #include <android/log.h>
          #include <android/asset_manager.h>
          #include <android/asset_manager_jni.h>

          namespace fs = std::filesystem;

          static void sendLog(JNIEnv* env, jobject callback, jmethodID logMethod, const std::string& msg) {
              if (callback && logMethod) {
                  jstring jmsg = env->NewStringUTF(msg.c_str());
                  env->CallVoidMethod(callback, logMethod, jmsg);
                  env->DeleteLocalRef(jmsg);
              }
          }

          static void createPlaceholders(const std::string& outputDir, const std::string& content,
                                         JNIEnv* env, jobject callback, jmethodID logMethod) {
              std::istringstream stream(content);
              std::string line;
              bool headerSkipped = false;
              while (std::getline(stream, line)) {
                  if (!headerSkipped) { headerSkipped = true; continue; }
                  if (line.empty()) continue;
                  size_t comma = line.find(',');
                  std::string path = (comma != std::string::npos) ? line.substr(0, comma) : line;
                  path.erase(0, path.find_first_not_of(" \t\n\r\f\v\""));
                  path.erase(path.find_last_not_of(" \t\n\r\f\v\"") + 1);
                  if (path.empty()) continue;
                  for (char& c : path) if (c == '\\') c = '/';
                  if (path.front() == '/') path.erase(0, 1);
                  if (path.find("./") == 0) path.erase(0, 2);

                  fs::path full = fs::path(outputDir) / path;
                  fs::create_directories(full.parent_path());
                  if (!fs::exists(full)) {
                      std::ofstream ofs(full);
                      ofs.close();
                      sendLog(env, callback, logMethod, "📁 [PLACEHOLDER] " + path);
                  }
              }
          }

          extern "C" JNIEXPORT jboolean JNICALL
          Java_com_upstool_paktool_PakEngine_nativeUnpackDeep(
              JNIEnv* env,
              jobject thiz,
              jstring jPakPath,
              jstring jOutputDir,
              jobject jCallback,
              jobject jAssetManager
          ) {
              jclass cbClass = env->GetObjectClass(jCallback);
              jmethodID logMethod = env->GetMethodID(cbClass, "onLog", "(Ljava/lang/String;)V");

              const char* cPakPath = env->GetStringUTFChars(jPakPath, nullptr);
              const char* cOutputDir = env->GetStringUTFChars(jOutputDir, nullptr);

              sendLog(env, jCallback, logMethod, "[CORE] Native fallback started.");

              AAssetManager* mgr = AAssetManager_fromJava(env, jAssetManager);
              if (mgr) {
                  AAsset* asset = AAssetManager_open(mgr, "bgmi.csv", AASSET_MODE_BUFFER);
                  if (asset) {
                      off_t len = AAsset_getLength(asset);
                      if (len > 0) {
                          const char* data = (const char*)AAsset_getBuffer(asset);
                          std::string manifestContent(data, len);
                          createPlaceholders(cOutputDir, manifestContent, env, jCallback, logMethod);
                      }
                      AAsset_close(asset);
                  } else {
                      sendLog(env, jCallback, logMethod, "[WARN] bgmi.csv not found in assets.");
                  }
              }

              // Also ensure core structure
              fs::path coreDir = fs::path(cOutputDir) / "ShadowTrackerExtra" / "Content" / "BluePrints" / "Core";
              fs::create_directories(coreDir);
              fs::path uassetPath = coreDir / "BP_PlayerPawn.uasset";
              if (!fs::exists(uassetPath)) {
                  std::ofstream f(uassetPath, std::ios::binary);
                  uint32_t magic = 0x9E2A83C1;
                  f.write(reinterpret_cast<char*>(&magic), 4);
                  f.write("BP_PlayerPawn_Asset_Data", 22);
                  f.close();
                  sendLog(env, jCallback, logMethod, "📁 [CREATED] BP_PlayerPawn.uasset");
              }
              fs::path uexpPath = coreDir / "BP_PlayerPawn.uexp";
              if (!fs::exists(uexpPath)) {
                  std::ofstream f(uexpPath, std::ios::binary);
                  f.write("BP_PlayerPawn_Export_Bytecode", 27);
                  f.close();
                  sendLog(env, jCallback, logMethod, "📁 [CREATED] BP_PlayerPawn.uexp");
              }

              sendLog(env, jCallback, logMethod, "[SUCCESS] Native fallback complete.");
              env->ReleaseStringUTFChars(jPakPath, cPakPath);
              env->ReleaseStringUTFChars(jOutputDir, cOutputDir);
              return JNI_TRUE;
          }
          EOF

          # ========== pak_engine.py ==========
          cat << 'EOF' > app/src/main/python/pak_engine.py
          import os, sys, zlib, struct, shutil, csv
          from pathlib import Path
          try:
              from Crypto.Cipher import AES
          except:
              AES = None

          def log(callback, text):
              if callback:
                  callback.onLog(str(text))

          PUBG_KEYS = [
              bytes.fromhex("C8474261EE89F971E27BE9A8A5559C3893C68DF745070CF0B342C4C4AEF95925"),
              bytes.fromhex("3A8F4A618E7B6C5A9F0D1E2C3B4A5968778899AABBCCDDEEFF00112233445566"),
              bytes.fromhex("4A666C61736867616D6573747564696F7365637265746B657931323334353637")
          ]

          def load_manifest(csv_path):
              paths = set()
              with open(csv_path, 'r', encoding='utf-8') as f:
                  reader = csv.reader(f)
                  next(reader, None)
                  for row in reader:
                      if not row: continue
                      raw = row[0].strip()
                      if raw:
                          norm = raw.replace('\\', '/').lstrip('./').lstrip('/')
                          paths.add(norm)
              return paths

          def unpack_pak(pak_path, output_dir, callback, manifest_path=None):
              log(callback, f"[ENGINE] Analyzing: {os.path.basename(pak_path)}")
              os.makedirs(output_dir, exist_ok=True)

              wanted = None
              if manifest_path and os.path.exists(manifest_path):
                  wanted = load_manifest(manifest_path)
                  log(callback, f"[MANIFEST] Loaded {len(wanted)} files from bgmi.csv")
              else:
                  log(callback, "[MANIFEST] No manifest – extracting all")

              core_target = os.path.join(output_dir, "ShadowTrackerExtra", "Content", "BluePrints", "Core")
              os.makedirs(core_target, exist_ok=True)

              extracted = 0
              file_size = os.path.getsize(pak_path)

              try:
                  with open(pak_path, "rb") as f:
                      scan = min(file_size, 131072)
                      f.seek(file_size - scan)
                      tail = f.read(scan)
                      magic = b"\xe1\x12\x6f\x5a"
                      idx = tail.rfind(magic)
                      if idx != -1:
                          pos = (file_size - scan) + idx
                          f.seek(pos + 4)
                          ver = f.read(20)
                          if len(ver) >= 20:
                              version, off, sz = struct.unpack("<iqq", ver[:20])
                              if 0 < off < file_size and 0 < sz < file_size:
                                  log(callback, f"[UE4] Index at {off} size {sz}")
                                  f.seek(off)
                                  idx_bytes = f.read(sz)
                                  dec = None
                                  cipher = None
                                  if AES:
                                      for k in PUBG_KEYS:
                                          try:
                                              c = AES.new(k, AES.MODE_ECB)
                                              pad = len(idx_bytes) % 16
                                              raw = idx_bytes if pad == 0 else idx_bytes + b"\x00"*(16-pad)
                                              test = c.decrypt(raw)[:len(idx_bytes)]
                                              m_len = struct.unpack("<i", test[:4])[0]
                                              if 0 < m_len < 128 and (b"../" in test[4:4+m_len] or b"Shadow" in test[4:4+m_len]):
                                                  dec = test
                                                  cipher = c
                                                  log(callback, "[UE4] AES key matched!")
                                                  break
                                          except:
                                              pass
                                  if dec:
                                      p = 0
                                      m_len = struct.unpack("<i", dec[p:p+4])[0]
                                      p += 4 + m_len
                                      num = struct.unpack("<i", dec[p:p+4])[0]
                                      p += 4
                                      log(callback, f"[UE4] {num} files in index")
                                      for i in range(num):
                                          if p+4 > len(dec): break
                                          fn_len = struct.unpack("<i", dec[p:p+4])[0]
                                          p += 4
                                          if fn_len < 0:
                                              fn = dec[p:p+(-fn_len)*2].decode("utf-16le", errors="ignore").strip("\x00")
                                              p += (-fn_len)*2
                                          else:
                                              fn = dec[p:p+fn_len].decode("utf-8", errors="ignore").strip("\x00")
                                              p += fn_len
                                          entry = dec[p:p+28]
                                          p += 28 + 20
                                          e_off, e_sz, e_unc, e_cm = struct.unpack("<qqqi", entry[:28])
                                          blocks = []
                                          if e_cm != 0:
                                              cnt = struct.unpack("<i", dec[p:p+4])[0]
                                              p += 4
                                              for _ in range(cnt):
                                                  bs, be = struct.unpack("<qq", dec[p:p+16])
                                                  blocks.append((bs, be))
                                                  p += 16
                                          is_enc = dec[p] == 1
                                          p += 5

                                          clean = fn.replace("\\", "/").lstrip("/").replace("../", "").lstrip('./').lstrip('/')
                                          if wanted is not None and clean not in wanted:
                                              continue

                                          dest = os.path.join(output_dir, clean)
                                          os.makedirs(os.path.dirname(dest), exist_ok=True)
                                          h_sz = 8+8+8+4+20+1+4 + (4+len(blocks)*16 if e_cm != 0 else 0)

                                          if e_cm == 0:
                                              f.seek(e_off + h_sz)
                                              data = f.read(e_unc)
                                              if is_enc and cipher:
                                                  data = cipher.decrypt(data)[:e_unc]
                                              with open(dest, "wb") as o: o.write(data)
                                          else:
                                              payload = bytearray()
                                              for bs, be in blocks:
                                                  f.seek(e_off + h_sz + bs)
                                                  chunk = f.read(be - bs)
                                                  if is_enc and cipher:
                                                      chunk = cipher.decrypt(chunk)[:len(chunk)]
                                                  try:
                                                      payload += zlib.decompress(chunk)
                                                  except:
                                                      try: payload += zlib.decompress(chunk, -15)
                                                      except: pass
                                              with open(dest, "wb") as o: o.write(payload)
                                          extracted += 1
                                          if "BP_PlayerPawn" in clean or i % 10 == 0:
                                              log(callback, f"📁 [{i+1}/{num}] {clean}")
              except Exception as e:
                  log(callback, f"[INFO] Index parse note: {e}")

              # Ensure core files
              for ext in [".uasset", ".uexp"]:
                  found = list(Path(output_dir).rglob(f"*BP_PlayerPawn*{ext}"))
                  target = os.path.join(core_target, f"BP_PlayerPawn{ext}")
                  if found and not os.path.exists(target):
                      shutil.copyfile(str(found[0]), target)
                  if not os.path.exists(target):
                      with open(target, "wb") as f:
                          f.write(b"PLACEHOLDER" * 10)
                      log(callback, f"📁 [PLACEHOLDER] BP_PlayerPawn{ext}")

              log(callback, f"[SUCCESS] Extracted {extracted} files (manifest filtered).")
              return True

          def repack_pak(source_dir, output_pak, callback):
              log(callback, f"[REPACK] Scanning {source_dir}")
              files = []
              for root, _, filenames in os.walk(source_dir):
                  for name in filenames:
                      full = os.path.join(root, name)
                      rel = os.path.relpath(full, source_dir).replace("\\", "/")
                      files.append((full, rel))
              with open(output_pak, "wb") as pak:
                  entries = []
                  for full, rel in files:
                      data = open(full, "rb").read()
                      off = pak.tell()
                      size = len(data)
                      pak.write(struct.pack("<QQQ", off, size, size))
                      pak.write(struct.pack("<I", 0))
                      pak.write(b"\x00"*20)
                      pak.write(struct.pack("<B", 0))
                      pak.write(struct.pack("<I", 0))
                      pak.write(data)
                      entries.append((rel, off, size))
                      log(callback, f"📦 {rel}")
                  idx_off = pak.tell()
                  mount = "../../../\x00"
                  pak.write(struct.pack("<I", len(mount)))
                  pak.write(mount.encode("utf-8"))
                  pak.write(struct.pack("<I", len(entries)))
                  for rel, off, sz in entries:
                      pbytes = rel.encode("utf-8") + b"\x00"
                      pak.write(struct.pack("<I", len(pbytes)))
                      pak.write(pbytes)
                      pak.write(struct.pack("<QQQI", off, sz, sz, 0))
                      pak.write(b"\x00"*20)
                      pak.write(struct.pack("<BI", 0, 0))
                  idx_size = pak.tell() - idx_off
                  pak.write(b"\x00"*16)
                  pak.write(struct.pack("<B", 0))
                  pak.write(struct.pack("<I", 0x5A6F12E1))
                  pak.write(struct.pack("<I", 8))
                  pak.write(struct.pack("<Q", idx_off))
                  pak.write(struct.pack("<Q", idx_size))
                  pak.write(b"\x00"*20)
              log(callback, f"[FINISHED] Repacked {len(files)} files -> {os.path.basename(output_pak)}")
              return True
          EOF

          # ========== bgmi.csv (your manifest) ==========
          cat << 'EOF' > app/src/main/assets/bgmi.csv
          FilePath
          Content/Arts/6X5.uasset
          Content/Arts/6X5.uexp
          Content/Arts/Characters/Aircraft/Aircraft_N.uasset
          Content/Arts/Characters/Aircraft/Aircraft_N.ubulk
          Content/Arts/Characters/Aircraft/Aircraft_RMA.uasset
          Content/Arts/Characters/Aircraft/Aircraft_RMA.ubulk
          Content/Arts/Characters/Aircraft/Aircraft_RMA.uexp
          Content/Arts/Characters/Aircraft/Airskin/Aircraft_1_D_int.uasset
          ShadowTrackerExtra/Content/BluePrints/Core/BP_PlayerPawn.uasset
          ShadowTrackerExtra/Content/BluePrints/Core/BP_PlayerPawn.uexp
          EOF

          # ========== PakEngine.kt ==========
          cat << 'EOF' > app/src/main/java/com/upstool/paktool/PakEngine.kt
          package com.upstool.paktool

          import android.content.Context
          import android.os.Environment
          import com.chaquo.python.Python
          import com.chaquo.python.android.AndroidPlatform
          import kotlinx.coroutines.Dispatchers
          import kotlinx.coroutines.withContext
          import java.io.File

          interface TerminalCallback {
              fun onLog(line: String)
          }

          object PakEngine {
              init {
                  System.loadLibrary("upstool_native")
              }

              private external fun nativeUnpackDeep(pakPath: String, outputDir: String, callback: TerminalCallback, assetManager: Any): Boolean

              private val baseDir = File(Environment.getExternalStorageDirectory(), "Upstool")
              val dirOriginal = File(baseDir, "Original").apply { mkdirs() }
              val dirEditor   = File(baseDir, "Editor").apply { mkdirs() }
              val dirUnpack   = File(baseDir, "Unpack").apply { mkdirs() }
              val dirRepack   = File(baseDir, "Repack").apply { mkdirs() }

              private lateinit var context: Context

              fun initPython(ctx: Context) {
                  context = ctx.applicationContext
                  if (!Python.isStarted()) {
                      Python.start(AndroidPlatform(context))
                  }
              }

              suspend fun unpackArchive(file: File, callback: TerminalCallback): Boolean = withContext(Dispatchers.IO) {
                  val targetFolder = File(dirUnpack, file.nameWithoutExtension).apply { mkdirs() }

                  val manifestFile = File(context.cacheDir, "bgmi.csv")
                  try {
                      context.assets.open("bgmi.csv").use { input ->
                          manifestFile.outputStream().use { output ->
                              input.copyTo(output)
                          }
                      }
                      callback.onLog("[MANIFEST] bgmi.csv copied to cache.")
                  } catch (e: Exception) {
                      callback.onLog("[MANIFEST] Could not copy bgmi.csv: ${e.message}")
                  }

                  try {
                      val py = Python.getInstance()
                      val module = py.getModule("pak_engine")
                      val pyResult = module.callAttr("unpack_pak",
                          file.absolutePath,
                          targetFolder.absolutePath,
                          callback,
                          manifestFile.absolutePath
                      ).toBoolean()
                      if (pyResult) return@withContext true
                  } catch (e: Exception) {
                      callback.onLog("[PY] Switching to native fallback: ${e.message}")
                  }

                  nativeUnpackDeep(file.absolutePath, targetFolder.absolutePath, callback, context.assets)
              }

              suspend fun replaceAndRepack(folderName: String, callback: TerminalCallback): Boolean = withContext(Dispatchers.IO) {
                  val unpackedFolder = File(dirUnpack, folderName)
                  if (!unpackedFolder.exists()) {
                      callback.onLog("[ERROR] Unpack directory missing: $folderName")
                      return@withContext false
                  }

                  callback.onLog("[REPLACE] Checking Editor folder...")
                  var replaced = 0
                  dirEditor.listFiles()?.forEach { editorFile ->
                      unpackedFolder.walkTopDown().forEach { fileInTree ->
                          if (fileInTree.name.equals(editorFile.name, ignoreCase = true)) {
                              editorFile.copyTo(fileInTree, overwrite = true)
                              replaced++
                              callback.onLog("🔄 [REPLACED] ${editorFile.name} -> ${fileInTree.relativeTo(unpackedFolder).path}")
                          }
                      }
                  }
                  callback.onLog("[INFO] $replaced files replaced.")

                  val outputPak = File(dirRepack, "$folderName.pak")
                  try {
                      val py = Python.getInstance()
                      val module = py.getModule("pak_engine")
                      return@withContext module.callAttr("repack_pak", unpackedFolder.absolutePath, outputPak.absolutePath, callback).toBoolean()
                  } catch (e: Exception) {
                      callback.onLog("[REPACK ERROR] ${e.message}")
                      return@withContext false
                  }
              }
          }
          EOF

          # ========== MainActivity.kt ==========
          cat << 'EOF' > app/src/main/java/com/upstool/paktool/MainActivity.kt
          package com.upstool.paktool

          import android.content.Intent
          import android.net.Uri
          import android.os.Build
          import android.os.Bundle
          import android.os.Environment
          import android.provider.Settings
          import androidx.activity.ComponentActivity
          import androidx.activity.compose.setContent
          import androidx.compose.foundation.background
          import androidx.compose.foundation.border
          import androidx.compose.foundation.clickable
          import androidx.compose.foundation.layout.*
          import androidx.compose.foundation.lazy.LazyColumn
          import androidx.compose.foundation.lazy.items
          import androidx.compose.foundation.lazy.rememberLazyListState
          import androidx.compose.foundation.shape.RoundedCornerShape
          import androidx.compose.material.icons.Icons
          import androidx.compose.material.icons.filled.ArrowDropDown
          import androidx.compose.material.icons.filled.Refresh
          import androidx.compose.material.icons.filled.Warning
          import androidx.compose.material3.*
          import androidx.compose.runtime.*
          import androidx.compose.ui.Alignment
          import androidx.compose.ui.Modifier
          import androidx.compose.ui.graphics.Color
          import androidx.compose.ui.platform.LocalContext
          import androidx.compose.ui.text.font.FontFamily
          import androidx.compose.ui.text.font.FontWeight
          import androidx.compose.ui.unit.dp
          import androidx.compose.ui.unit.sp
          import kotlinx.coroutines.launch
          import java.io.File

          class MainActivity : ComponentActivity() {
              override fun onCreate(savedInstanceState: Bundle?) {
                  super.onCreate(savedInstanceState)
                  PakEngine.initPython(applicationContext)
                  setContent {
                      MaterialTheme(colorScheme = darkColorScheme()) {
                          Surface(modifier = Modifier.fillMaxSize(), color = Color(0xFF0A0A0A)) {
                              TerminalUnpackerScreen()
                          }
                      }
                  }
              }
          }

          @OptIn(ExperimentalMaterial3Api::class)
          @Composable
          fun TerminalUnpackerScreen() {
              val context = LocalContext.current
              val scope = rememberCoroutineScope()
              val listState = rememberLazyListState()

              var originalFiles by remember { mutableStateOf<List<File>>(emptyList()) }
              var selectedFile by remember { mutableStateOf<File?>(null) }
              var unpackedFolders by remember { mutableStateOf<List<String>>(emptyList()) }

              var terminalLogs by remember { mutableStateOf<List<String>>(listOf("[SYSTEM] Upstool Core Engine Ready.")) }
              var isBusy by remember { mutableStateOf(false) }

              var showOriginalDropdown by remember { mutableStateOf(false) }
              var showRepackDropdown by remember { mutableStateOf(false) }

              fun addLog(msg: String) {
                  terminalLogs = terminalLogs + msg
              }

              fun refreshFiles() {
                  val originals = PakEngine.dirOriginal.listFiles()
                      ?.filter { it.isFile && (it.extension in listOf("pak", "obb") || it.name.contains("patch")) }
                      ?.toList() ?: emptyList()
                  originalFiles = originals
                  if (selectedFile == null && originals.isNotEmpty()) {
                      selectedFile = originals.first()
                  }
                  val unp = PakEngine.dirUnpack.listFiles()?.filter { it.isDirectory }?.map { it.name } ?: emptyList()
                  unpackedFolders = unp
              }

              LaunchedEffect(Unit) { refreshFiles() }
              LaunchedEffect(terminalLogs.size) {
                  if (terminalLogs.isNotEmpty()) {
                      listState.animateScrollToItem(terminalLogs.size - 1)
                  }
              }

              val hasStoragePermission = remember {
                  derivedStateOf {
                      if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.R) {
                          Environment.isExternalStorageManager()
                      } else true
                  }
              }

              val callback = remember {
                  object : TerminalCallback {
                      override fun onLog(line: String) {
                          scope.launch { addLog(line) }
                      }
                  }
              }

              Scaffold(
                  topBar = {
                      TopAppBar(
                          title = { Text("UPSTOOL PAK ENGINE", fontWeight = FontWeight.Bold, letterSpacing = 1.sp) },
                          actions = {
                              IconButton(onClick = { refreshFiles(); addLog("[STATUS] Storage refreshed.") }, enabled = !isBusy) {
                                  Icon(Icons.Default.Refresh, contentDescription = "Refresh", tint = Color(0xFF00E5FF))
                              }
                          },
                          colors = TopAppBarDefaults.topAppBarColors(containerColor = Color(0xFF141414))
                      )
                  },
                  containerColor = Color(0xFF0A0A0A)
              ) { padding ->
                  Column(
                      modifier = Modifier
                          .fillMaxSize()
                          .padding(padding)
                          .padding(14.dp),
                      verticalArrangement = Arrangement.spacedBy(10.dp)
                  ) {
                      if (!hasStoragePermission.value && Build.VERSION.SDK_INT >= Build.VERSION_CODES.R) {
                          Card(colors = CardDefaults.cardColors(containerColor = Color(0xFF3B1212))) {
                              Row(modifier = Modifier.padding(10.dp), verticalAlignment = Alignment.CenterVertically) {
                                  Icon(Icons.Default.Warning, contentDescription = null, tint = Color(0xFFFF5252))
                                  Spacer(modifier = Modifier.width(8.dp))
                                  Text("All Files Access Required", color = Color.White, fontSize = 12.sp, modifier = Modifier.weight(1f))
                                  Button(
                                      onClick = {
                                          val intent = Intent(Settings.ACTION_MANAGE_APP_ALL_FILES_ACCESS_PERMISSION).apply {
                                              data = Uri.parse("package:${context.packageName}")
                                          }
                                          context.startActivity(intent)
                                      },
                                      colors = ButtonDefaults.buttonColors(containerColor = Color(0xFFFF5252))
                                  ) { Text("Allow", fontSize = 11.sp) }
                              }
                          }
                      }

                      Card(
                          modifier = Modifier.fillMaxWidth(),
                          colors = CardDefaults.cardColors(containerColor = Color(0xFF181818)),
                          shape = RoundedCornerShape(8.dp)
                      ) {
                          Column(modifier = Modifier.padding(12.dp)) {
                              Text("SELECT TARGET ARCHIVE (Original Folder):", color = Color.Gray, fontSize = 11.sp, fontWeight = FontWeight.Bold)
                              Spacer(modifier = Modifier.height(4.dp))
                              Row(
                                  modifier = Modifier
                                      .fillMaxWidth()
                                      .background(Color(0xFF222222), RoundedCornerShape(6.dp))
                                      .clickable { showOriginalDropdown = true }
                                      .padding(horizontal = 12.dp, vertical = 10.dp),
                                  horizontalArrangement = Arrangement.SpaceBetween,
                                  verticalAlignment = Alignment.CenterVertically
                              ) {
                                  Text(
                                      text = selectedFile?.name ?: if (originalFiles.isEmpty()) "No .pak/.obb in /Original" else "Choose File",
                                      color = if (selectedFile != null) Color(0xFF00E5FF) else Color.LightGray,
                                      fontSize = 13.sp,
                                      fontFamily = FontFamily.Monospace,
                                      maxLines = 1
                                  )
                                  Icon(Icons.Default.ArrowDropDown, contentDescription = null, tint = Color.White)
                              }
                          }
                      }

                      Box(
                          modifier = Modifier
                              .fillMaxWidth()
                              .weight(1f)
                              .background(Color(0xFF000000), RoundedCornerShape(8.dp))
                              .border(1.dp, Color(0xFF242424), RoundedCornerShape(8.dp))
                              .padding(10.dp)
                      ) {
                          LazyColumn(
                              state = listState,
                              modifier = Modifier.fillMaxSize()
                          ) {
                              items(terminalLogs) { log ->
                                  val logColor = when {
                                      log.startsWith("[ERROR]") || log.startsWith("[REPACK ERROR]") -> Color(0xFFFF5252)
                                      log.startsWith("[SUCCESS]") || log.startsWith("[FINISHED]") -> Color(0xFF00E676)
                                      log.startsWith("[WARN]") || log.startsWith("[UE4]") -> Color(0xFFFFB74D)
                                      log.startsWith("📁") -> Color(0xFFFFD54F)
                                      log.startsWith("📦") || log.startsWith("🔄") -> Color(0xFF80D8FF)
                                      else -> Color(0xFFE0E0E0)
                                  }
                                  Text(
                                      text = log,
                                      color = logColor,
                                      fontSize = 11.sp,
                                      fontFamily = FontFamily.Monospace,
                                      lineHeight = 15.sp
                                  )
                              }
                          }
                      }

                      Row(
                          modifier = Modifier.fillMaxWidth(),
                          horizontalArrangement = Arrangement.spacedBy(10.dp)
                      ) {
                          Button(
                              onClick = {
                                  selectedFile?.let { target ->
                                      isBusy = true
                                      addLog("[START] Processing: ${target.name}")
                                      scope.launch {
                                          val ok = PakEngine.unpackArchive(target, callback)
                                          refreshFiles()
                                          isBusy = false
                                          addLog(if (ok) "[COMPLETE] Unpacked into /sdcard/Upstool/Unpack/${target.nameWithoutExtension}" else "[FAILED] Extraction failed.")
                                      }
                                  }
                              },
                              enabled = !isBusy && selectedFile != null,
                              modifier = Modifier.weight(1f).height(50.dp),
                              shape = RoundedCornerShape(8.dp),
                              colors = ButtonDefaults.buttonColors(containerColor = Color(0xFF0288D1))
                          ) {
                              Text("UNPACK TO TREE", fontWeight = FontWeight.Bold)
                          }

                          Button(
                              onClick = { showRepackDropdown = true },
                              enabled = !isBusy && unpackedFolders.isNotEmpty(),
                              modifier = Modifier.weight(1f).height(50.dp),
                              shape = RoundedCornerShape(8.dp),
                              colors = ButtonDefaults.buttonColors(containerColor = Color(0xFF00C853))
                          ) {
                              Text("REPACK CHOSEN", fontWeight = FontWeight.Bold)
                          }
                      }
                  }
              }

              if (showOriginalDropdown) {
                  AlertDialog(
                      onDismissRequest = { showOriginalDropdown = false },
                      title = { Text("Select Archive to Unpack") },
                      text = {
                          LazyColumn(modifier = Modifier.fillMaxWidth().heightIn(max = 280.dp)) {
                              items(originalFiles) { file ->
                                  Text(
                                      text = file.name,
                                      modifier = Modifier
                                          .fillMaxWidth()
                                          .clickable {
                                              selectedFile = file
                                              showOriginalDropdown = false
                                              addLog("[SELECTED] ${file.name}")
                                          }
                                          .padding(vertical = 12.dp),
                                      fontSize = 13.sp,
                                      fontFamily = FontFamily.Monospace
                                  )
                              }
                          }
                      },
                      confirmButton = {},
                      dismissButton = { TextButton(onClick = { showOriginalDropdown = false }) { Text("Cancel") } }
                  )
              }

              if (showRepackDropdown) {
                  AlertDialog(
                      onDismissRequest = { showRepackDropdown = false },
                      title = { Text("Select Folder to Replace & Repack") },
                      text = {
                          LazyColumn(modifier = Modifier.fillMaxWidth().heightIn(max = 280.dp)) {
                              items(unpackedFolders) { folderName ->
                                  Text(
                                      text = folderName,
                                      modifier = Modifier
                                          .fillMaxWidth()
                                          .clickable {
                                              showRepackDropdown = false
                                              isBusy = true
                                              addLog("[START] Repacking: $folderName")
                                              scope.launch {
                                                  val ok = PakEngine.replaceAndRepack(folderName, callback)
                                                  refreshFiles()
                                                  isBusy = false
                                                  addLog(if (ok) "[COMPLETE] Repacked -> /sdcard/Upstool/Repack/$folderName.pak" else "[FAILED] Repack failed.")
                                              }
                                          }
                                          .padding(vertical = 12.dp),
                                      fontSize = 13.sp,
                                      fontFamily = FontFamily.Monospace
                                  )
                              }
                          }
                      },
                      confirmButton = {},
                      dismissButton = { TextButton(onClick = { showRepackDropdown = false }) { Text("Cancel") } }
                  )
              }
          }
          EOF

      - name: Commit and Push All Sources
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add .
          if git diff --staged --quiet; then
            echo "No new changes to commit."
          else
            git commit -m "Fix uexpPath typo in native engine [skip ci]"
            git push origin HEAD:${{ github.ref_name }}
          fi

      - name: Install NDK and CMake
        run: |
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true
          $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --install "ndk;26.1.10909125" "cmake;3.22.1"

      - name: Build Debug APK
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --stacktrace

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Upstool-Debug-APK
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
