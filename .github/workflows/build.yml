name: Setup Project and Build APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Generate Complete Source Tree
        run: |
          mkdir -p gradle/wrapper
          mkdir -p app/src/main/cpp
          mkdir -p app/src/main/java/com/upstool/paktool
          mkdir -p app/src/main/res/values

          # 1. gradle.properties (Fixes AndroidX requirement & Memory)
          cat << 'EOF' > gradle.properties
          org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
          android.useAndroidX=true
          android.nonTransitiveRClass=true
          kotlin.code.style=official
          EOF

          # 2. settings.gradle.kts
          cat << 'EOF' > settings.gradle.kts
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }
          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories {
                  google()
                  mavenCentral()
              }
          }
          rootProject.name = "Upstool"
          include(":app")
          EOF

          # 3. Root build.gradle.kts
          cat << 'EOF' > build.gradle.kts
          plugins {
              id("com.android.application") version "8.3.2" apply false
              id("org.jetbrains.kotlin.android") version "1.9.22" apply false
          }
          EOF

          # 4. app/build.gradle.kts
          cat << 'EOF' > app/build.gradle.kts
          plugins {
              id("com.android.application")
              id("org.jetbrains.kotlin.android")
          }

          android {
              namespace = "com.upstool.paktool"
              compileSdk = 34

              defaultConfig {
                  applicationId = "com.upstool.paktool"
                  minSdk = 24
                  targetSdk = 34
                  versionCode = 1
                  versionName = "1.0.0"

                  ndk {
                      abiFilters.addAll(listOf("arm64-v8a", "armeabi-v7a"))
                  }

                  externalNativeBuild {
                      cmake {
                          cppFlags += "-std=c++17"
                          arguments += "-DANDROID_STL=c++_shared"
                      }
                  }
              }

              buildTypes {
                  release {
                      isMinifyEnabled = false
                      proguardFiles(getDefaultProguardFile("proguard-android-optimize.txt"), "proguard-rules.pro")
                  }
              }

              compileOptions {
                  sourceCompatibility = JavaVersion.VERSION_17
                  targetCompatibility = JavaVersion.VERSION_17
              }

              kotlinOptions {
                  jvmTarget = "17"
              }

              buildFeatures {
                  compose = true
              }

              composeOptions {
                  kotlinCompilerExtensionVersion = "1.5.8"
              }

              externalNativeBuild {
                  cmake {
                      path = file("src/main/cpp/CMakeLists.txt")
                      version = "3.22.1"
                  }
              }

              ndkVersion = "26.1.10909125"
          }

          dependencies {
              val composeBom = platform("androidx.compose:compose-bom:2024.02.00")
              implementation(composeBom)
              implementation("androidx.core:core-ktx:1.12.0")
              implementation("androidx.lifecycle:lifecycle-runtime-ktx:2.7.0")
              implementation("androidx.activity:activity-compose:1.8.2")
              implementation("androidx.lifecycle:lifecycle-viewmodel-compose:2.7.0")
              implementation("androidx.compose.ui:ui")
              implementation("androidx.compose.ui:ui-graphics")
              implementation("androidx.compose.material3:material3")
              implementation("androidx.compose.material:material-icons-extended")
              implementation("org.jetbrains.kotlinx:kotlinx-coroutines-android:1.7.3")
          }
          EOF

          # 5. Strings resource
          cat << 'EOF' > app/src/main/res/values/strings.xml
          <resources>
              <string name="app_name">Upstool</string>
          </resources>
          EOF

          # 6. AndroidManifest.xml
          cat << 'EOF' > app/src/main/AndroidManifest.xml
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android"
              xmlns:tools="http://schemas.android.com/tools">

              <uses-permission android:name="android.permission.READ_EXTERNAL_STORAGE" />
              <uses-permission android:name="android.permission.WRITE_EXTERNAL_STORAGE" />
              <uses-permission
                  android:name="android.permission.MANAGE_EXTERNAL_STORAGE"
                  tools:ignore="ScopedStorage" />

              <application
                  android:allowBackup="true"
                  android:label="@string/app_name"
                  android:requestLegacyExternalStorage="true"
                  android:supportsRtl="true"
                  android:theme="@android:style/Theme.Material.NoActionBar">
                  <activity
                      android:name=".MainActivity"
                      android:exported="true"
                      android:windowSoftInputMode="adjustResize">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>
              </application>
          </manifest>
          EOF

          # 7. CMakeLists.txt
          cat << 'EOF' > app/src/main/cpp/CMakeLists.txt
          cmake_minimum_required(VERSION 3.22.1)
          project("upstool_native")

          set(CMAKE_CXX_STANDARD 17)

          add_library(upstool_native SHARED
              pak_engine.cpp
          )

          find_library(log-lib log)
          find_package(ZLIB REQUIRED)

          target_link_libraries(upstool_native
              ${log-lib}
              ZLIB::ZLIB
          )
          EOF

          # 8. Fixed C++ Engine with Real-Time Terminal Streaming
          cat << 'EOF' > app/src/main/cpp/pak_engine.cpp
          #include <jni.h>
          #include <string>
          #include <vector>
          #include <fstream>
          #include <filesystem>
          #include <algorithm>
          #include <cstdint>
          #include <zlib.h>
          #include <android/log.h>

          namespace fs = std::filesystem;

          #define LOG_TAG "UpstoolEngine"
          #define LOGI(...) __android_log_print(ANDROID_LOG_INFO, LOG_TAG, __VA_ARGS__)
          #define LOGE(...) __android_log_print(ANDROID_LOG_ERROR, LOG_TAG, __VA_ARGS__)

          constexpr uint32_t PAK_MAGIC = 0x5A6F12E1;

          #pragma pack(push, 1)
          struct FPakCompressedBlock {
              int64_t compressedStart;
              int64_t compressedEnd;
          };

          struct FPakInfo {
              int32_t  version = 8;
              int64_t  indexOffset = 0;
              int64_t  indexSize = 0;
              uint8_t  indexHash[20] = {0};
              uint8_t  bEncryptedIndex = 0;
              uint32_t magic = PAK_MAGIC;
          };
          #pragma pack(pop)

          struct FPakEntry {
              std::string filename;
              int64_t  offset = 0;
              int64_t  size = 0;
              int64_t  uncompressedSize = 0;
              int32_t  compressionMethod = 0; // 0 = None, 1 = Zlib
              uint8_t  hash[20] = {0};
              std::vector<FPakCompressedBlock> compressionBlocks;
              uint8_t  bEncrypted = 0;
              uint32_t compressionBlockSize = 0;

              int64_t getSerializedHeaderSize() const {
                  int64_t baseSize = sizeof(int64_t) * 3 + sizeof(int32_t) + 20 + sizeof(uint8_t) + sizeof(uint32_t);
                  if (compressionMethod != 0) {
                      baseSize += sizeof(int32_t) + (compressionBlocks.size() * sizeof(FPakCompressedBlock));
                  }
                  return baseSize;
              }
          };

          static void sendTerminalLog(JNIEnv* env, jobject callback, jmethodID logMethod, const std::string& msg) {
              if (callback && logMethod) {
                  jstring jmsg = env->NewStringUTF(msg.c_str());
                  env->CallVoidMethod(callback, logMethod, jmsg);
                  env->DeleteLocalRef(jmsg);
              }
          }

          static std::string readFString(std::ifstream& stream) {
              int32_t length = 0;
              if (!stream.read(reinterpret_cast<char*>(&length), sizeof(int32_t))) return "";
              if (length == 0) return "";
              if (length > 1048576 || length < -1048576) return "";

              if (length < 0) {
                  int32_t ucs2Len = -length;
                  std::vector<uint16_t> wbuf(ucs2Len);
                  stream.read(reinterpret_cast<char*>(wbuf.data()), ucs2Len * sizeof(uint16_t));
                  std::string res;
                  res.reserve(ucs2Len);
                  for (auto c : wbuf) {
                      if (c != 0) res.push_back(static_cast<char>(c));
                  }
                  while (!res.empty() && res.back() == '\0') res.pop_back();
                  return res;
              }

              std::vector<char> buffer(length);
              stream.read(buffer.data(), length);
              std::string res(buffer.data(), length);
              while (!res.empty() && res.back() == '\0') res.pop_back();
              return res;
          }

          static void writeFString(std::ofstream& stream, const std::string& str) {
              int32_t length = static_cast<int32_t>(str.length() + 1);
              stream.write(reinterpret_cast<const char*>(&length), sizeof(int32_t));
              stream.write(str.c_str(), length);
          }

          static FPakEntry readEntry(std::ifstream& stream) {
              FPakEntry entry;
              stream.read(reinterpret_cast<char*>(&entry.offset), sizeof(int64_t));
              stream.read(reinterpret_cast<char*>(&entry.size), sizeof(int64_t));
              stream.read(reinterpret_cast<char*>(&entry.uncompressedSize), sizeof(int64_t));
              stream.read(reinterpret_cast<char*>(&entry.compressionMethod), sizeof(int32_t));
              stream.read(reinterpret_cast<char*>(entry.hash), 20);

              if (entry.compressionMethod != 0) {
                  int32_t blockCount = 0;
                  stream.read(reinterpret_cast<char*>(&blockCount), sizeof(int32_t));
                  if (blockCount > 0 && blockCount < 100000) {
                      entry.compressionBlocks.resize(blockCount);
                      for (int32_t i = 0; i < blockCount; ++i) {
                          stream.read(reinterpret_cast<char*>(&entry.compressionBlocks[i]), sizeof(FPakCompressedBlock));
                      }
                  }
              }
              stream.read(reinterpret_cast<char*>(&entry.bEncrypted), sizeof(uint8_t));
              stream.read(reinterpret_cast<char*>(&entry.compressionBlockSize), sizeof(uint32_t));
              return entry;
          }

          static void writeEntry(std::ofstream& stream, const FPakEntry& entry) {
              stream.write(reinterpret_cast<const char*>(&entry.offset), sizeof(int64_t));
              stream.write(reinterpret_cast<const char*>(&entry.size), sizeof(int64_t));
              stream.write(reinterpret_cast<const char*>(&entry.uncompressedSize), sizeof(int64_t));
              stream.write(reinterpret_cast<const char*>(&entry.compressionMethod), sizeof(int32_t));
              stream.write(reinterpret_cast<const char*>(entry.hash), 20);

              if (entry.compressionMethod != 0) {
                  int32_t blockCount = static_cast<int32_t>(entry.compressionBlocks.size());
                  stream.write(reinterpret_cast<const char*>(&blockCount), sizeof(int32_t));
                  for (const auto& block : entry.compressionBlocks) {
                      stream.write(reinterpret_cast<const char*>(&block), sizeof(FPakCompressedBlock));
                  }
              }
              stream.write(reinterpret_cast<const char*>(&entry.bEncrypted), sizeof(uint8_t));
              stream.write(reinterpret_cast<const char*>(&entry.compressionBlockSize), sizeof(uint32_t));
          }

          static bool decompressZlib(const uint8_t* src, size_t srcLen, uint8_t* dst, size_t dstLen) {
              z_stream strm{};
              strm.next_in = const_cast<Bytef*>(src);
              strm.avail_in = static_cast<uInt>(srcLen);
              strm.next_out = dst;
              strm.avail_out = static_cast<uInt>(dstLen);

              if (inflateInit(&strm) != Z_OK) return false;
              int ret = inflate(&strm, Z_FINISH);
              inflateEnd(&strm);
              return (ret == Z_STREAM_END || ret == Z_OK);
          }

          extern "C" JNIEXPORT jboolean JNICALL
          Java_com_upstool_paktool_PakEngine_nativeUnpackPak(
              JNIEnv* env,
              jobject,
              jstring jPakPath,
              jstring jOutputDir,
              jobject jCallback
          ) {
              jclass cbClass = env->GetObjectClass(jCallback);
              jmethodID logMethod = env->GetMethodID(cbClass, "onLog", "(Ljava/lang/String;)V");

              const char* cPakPath = env->GetStringUTFChars(jPakPath, nullptr);
              const char* cOutputDir = env->GetStringUTFChars(jOutputDir, nullptr);

              sendTerminalLog(env, jCallback, logMethod, "[INIT] Opening archive: " + std::string(cPakPath));

              std::ifstream file(cPakPath, std::ios::binary | std::ios::ate);
              if (!file.is_open()) {
                  sendTerminalLog(env, jCallback, logMethod, "[ERROR] Cannot open source archive file.");
                  env->ReleaseStringUTFChars(jPakPath, cPakPath);
                  env->ReleaseStringUTFChars(jOutputDir, cOutputDir);
                  return JNI_FALSE;
              }

              std::streamsize fileSize = file.tellg();
              if (fileSize < 128) {
                  sendTerminalLog(env, jCallback, logMethod, "[ERROR] File size too small to be valid archive.");
                  file.close();
                  env->ReleaseStringUTFChars(jPakPath, cPakPath);
                  env->ReleaseStringUTFChars(jOutputDir, cOutputDir);
                  return JNI_FALSE;
              }

              // Scan last 64 KB backwards for PAK_MAGIC
              size_t scanSize = std::min(fileSize, static_cast<std::streamsize>(65536));
              std::vector<uint8_t> buffer(scanSize);
              file.seekg(fileSize - scanSize);
              file.read(reinterpret_cast<char*>(buffer.data()), scanSize);

              int64_t magicOffset = -1;
              for (int64_t i = scanSize - 4; i >= 0; --i) {
                  if (*reinterpret_cast<uint32_t*>(&buffer[i]) == PAK_MAGIC) {
                      magicOffset = fileSize - scanSize + i;
                      break;
                  }
              }

              if (magicOffset == -1) {
                  sendTerminalLog(env, jCallback, logMethod, "[ERROR] Unreal PAK Magic bytes (0x5A6F12E1) not found.");
                  file.close();
                  env->ReleaseStringUTFChars(jPakPath, cPakPath);
                  env->ReleaseStringUTFChars(jOutputDir, cOutputDir);
                  return JNI_FALSE;
              }

              // In UE4: Magic is followed by Version, IndexOffset, IndexSize
              file.seekg(magicOffset + 4);
              int32_t version = 0;
              int64_t indexOffset = 0;
              int64_t indexSize = 0;
              file.read(reinterpret_cast<char*>(&version), sizeof(int32_t));
              file.read(reinterpret_cast<char*>(&indexOffset), sizeof(int64_t));
              file.read(reinterpret_cast<char*>(&indexSize), sizeof(int64_t));

              sendTerminalLog(env, jCallback, logMethod, "[INDEX] Found PAK v" + std::to_string(version) + " | Offset: " + std::to_string(indexOffset));

              if (indexOffset <= 0 || indexOffset >= fileSize) {
                  sendTerminalLog(env, jCallback, logMethod, "[ERROR] Corrupt or invalid Index Table offset.");
                  file.close();
                  env->ReleaseStringUTFChars(jPakPath, cPakPath);
                  env->ReleaseStringUTFChars(jOutputDir, cOutputDir);
                  return JNI_FALSE;
              }

              file.seekg(indexOffset);
              std::string mountPoint = readFString(file);
              int32_t entryCount = 0;
              file.read(reinterpret_cast<char*>(&entryCount), sizeof(int32_t));

              sendTerminalLog(env, jCallback, logMethod, "[TREE] Mount: " + mountPoint + " | Total Files: " + std::to_string(entryCount));

              int successCount = 0;
              for (int32_t i = 0; i < entryCount; ++i) {
                  std::string internalPath = readFString(file);
                  FPakEntry entry = readEntry(file);

                  std::string cleanRelPath = internalPath;
                  while (cleanRelPath.rfind("../", 0) == 0) cleanRelPath.erase(0, 3);
                  while (cleanRelPath.rfind("..\\", 0) == 0) cleanRelPath.erase(0, 3);
                  while (!cleanRelPath.empty() && (cleanRelPath.front() == '/' || cleanRelPath.front() == '\\')) {
                      cleanRelPath.erase(0, 1);
                  }
                  std::replace(cleanRelPath.begin(), cleanRelPath.end(), '\\', '/');

                  fs::path destPath = fs::path(cOutputDir) / cleanRelPath;
                  fs::create_directories(destPath.parent_path());

                  std::ofstream outFile(destPath, std::ios::binary);
                  if (!outFile.is_open()) continue;

                  std::streampos savedIndexPos = file.tellg();
                  int64_t dataOffset = entry.offset + entry.getSerializedHeaderSize();

                  if (entry.compressionMethod == 0) {
                      file.seekg(dataOffset);
                      std::vector<char> chunk(65536);
                      int64_t remain = entry.uncompressedSize;
                      while (remain > 0) {
                          std::streamsize readBytes = std::min(static_cast<int64_t>(chunk.size()), remain);
                          file.read(chunk.data(), readBytes);
                          outFile.write(chunk.data(), readBytes);
                          remain -= readBytes;
                      }
                  } else {
                      uint32_t blockSize = entry.compressionBlockSize > 0 ? entry.compressionBlockSize : 65536;
                      std::vector<uint8_t> blockBuffer(blockSize);
                      int64_t remain = entry.uncompressedSize;

                      for (const auto& block : entry.compressionBlocks) {
                          int64_t cSize = block.compressedEnd - block.compressedStart;
                          std::vector<uint8_t> cBuffer(cSize);

                          file.seekg(dataOffset + block.compressedStart);
                          file.read(reinterpret_cast<char*>(cBuffer.data()), cSize);

                          size_t outSize = std::min(static_cast<int64_t>(blockSize), remain);
                          decompressZlib(cBuffer.data(), cSize, blockBuffer.data(), outSize);
                          outFile.write(reinterpret_cast<char*>(blockBuffer.data()), outSize);
                          remain -= outSize;
                      }
                  }

                  outFile.close();
                  file.seekg(savedIndexPos);
                  successCount++;

                  // Terminal stream update every 5 files or on uasset/uexp
                  if (i % 5 == 0 || cleanRelPath.find(".uasset") != std::string::npos || cleanRelPath.find(".uexp") != std::string::npos) {
                      sendTerminalLog(env, jCallback, logMethod, "📁 [" + std::to_string(i + 1) + "/" + std::to_string(entryCount) + "] " + cleanRelPath);
                  }
              }

              file.close();
              sendTerminalLog(env, jCallback, logMethod, "[SUCCESS] Extracted " + std::to_string(successCount) + " files with full structure.");

              env->ReleaseStringUTFChars(jPakPath, cPakPath);
              env->ReleaseStringUTFChars(jOutputDir, cOutputDir);
              return JNI_TRUE;
          }

          extern "C" JNIEXPORT jboolean JNICALL
          Java_com_upstool_paktool_PakEngine_nativeRepackPak(
              JNIEnv* env,
              jobject,
              jstring jSourceDir,
              jstring jOutputPak,
              jobject jCallback
          ) {
              jclass cbClass = env->GetObjectClass(jCallback);
              jmethodID logMethod = env->GetMethodID(cbClass, "onLog", "(Ljava/lang/String;)V");

              const char* cSrc = env->GetStringUTFChars(jSourceDir, nullptr);
              const char* cOut = env->GetStringUTFChars(jOutputPak, nullptr);

              sendTerminalLog(env, jCallback, logMethod, "[REPACK] Serializing tree from: " + std::string(cSrc));

              std::ofstream pak(cOut, std::ios::binary | std::ios::trunc);
              if (!pak.is_open()) {
                  sendTerminalLog(env, jCallback, logMethod, "[ERROR] Cannot create output archive: " + std::string(cOut));
                  env->ReleaseStringUTFChars(jSourceDir, cSrc);
                  env->ReleaseStringUTFChars(jOutputPak, cOut);
                  return JNI_FALSE;
              }

              std::vector<FPakEntry> entries;

              for (const auto& dirEntry : fs::recursive_directory_iterator(cSrc)) {
                  if (!dirEntry.is_regular_file()) continue;

                  fs::path fullPath = dirEntry.path();
                  std::string relPath = fs::relative(fullPath, cSrc).generic_string();

                  int64_t fileOffset = pak.tellp();
                  int64_t fileSize = fs::file_size(fullPath);

                  FPakEntry entry;
                  entry.filename = relPath;
                  entry.offset = fileOffset;
                  entry.size = fileSize;
                  entry.uncompressedSize = fileSize;
                  entry.compressionMethod = 0;
                  entry.bEncrypted = 0;

                  writeEntry(pak, entry);

                  std::ifstream srcStream(fullPath, std::ios::binary);
                  pak << srcStream.rdbuf();
                  srcStream.close();

                  entries.push_back(entry);
                  sendTerminalLog(env, jCallback, logMethod, "📦 [PACK] " + relPath);
              }

              int64_t indexOffset = pak.tellp();
              writeFString(pak, "../../../");

              int32_t totalFiles = static_cast<int32_t>(entries.size());
              pak.write(reinterpret_cast<const char*>(&totalFiles), sizeof(int32_t));

              for (const auto& entry : entries) {
                  writeFString(pak, entry.filename);
                  writeEntry(pak, entry);
              }

              int64_t indexSize = static_cast<int64_t>(pak.tellp()) - indexOffset;

              FPakInfo footer;
              footer.version = 8;
              footer.indexOffset = indexOffset;
              footer.indexSize = indexSize;
              footer.magic = PAK_MAGIC;
              pak.write(reinterpret_cast<const char*>(&footer), sizeof(FPakInfo));

              pak.close();
              sendTerminalLog(env, jCallback, logMethod, "[FINISHED] Repacked " + std::to_string(totalFiles) + " files -> " + std::string(cOut));

              env->ReleaseStringUTFChars(jSourceDir, cSrc);
              env->ReleaseStringUTFChars(jOutputPak, cOut);
              return JNI_TRUE;
          }
          EOF

          # 9. PakEngine.kt with ZIP/OBB support and Callback
          cat << 'EOF' > app/src/main/java/com/upstool/paktool/PakEngine.kt
          package com.upstool.paktool

          import android.os.Environment
          import kotlinx.coroutines.Dispatchers
          import kotlinx.coroutines.withContext
          import java.io.File
          import java.io.FileInputStream
          import java.io.FileOutputStream
          import java.util.zip.ZipInputStream

          interface TerminalCallback {
              fun onLog(line: String)
          }

          object PakEngine {
              init {
                  System.loadLibrary("upstool_native")
              }

              private external fun nativeUnpackPak(pakPath: String, outputDir: String, callback: TerminalCallback): Boolean
              private external fun nativeRepackPak(sourceDir: String, outputPak: String, callback: TerminalCallback): Boolean

              private val baseDir = File(Environment.getExternalStorageDirectory(), "Upstool")
              val dirOriginal = File(baseDir, "Original").apply { mkdirs() }
              val dirEditor   = File(baseDir, "Editor").apply { mkdirs() }
              val dirUnpack   = File(baseDir, "Unpack").apply { mkdirs() }
              val dirRepack   = File(baseDir, "Repack").apply { mkdirs() }

              suspend fun unpackArchive(file: File, callback: TerminalCallback): Boolean = withContext(Dispatchers.IO) {
                  val targetFolder = File(dirUnpack, file.nameWithoutExtension).apply { mkdirs() }

                  // If file is an OBB or ZIP format (Magic: PK\x03\x04)
                  val isZip = try {
                      FileInputStream(file).use { fis ->
                          val header = ByteArray(4)
                          fis.read(header)
                          header[0] == 0x50.toByte() && header[1] == 0x4B.toByte()
                      }
                  } catch (e: Exception) {
                      false
                  }

                  if (isZip) {
                      callback.onLog("[OBB/ZIP] Detected ZIP format. Extracting...")
                      return@withContext unpackZip(file, targetFolder, callback)
                  } else {
                      return@withContext nativeUnpackPak(file.absolutePath, targetFolder.absolutePath, callback)
                  }
              }

              private fun unpackZip(zipFile: File, targetDir: File, callback: TerminalCallback): Boolean {
                  try {
                      ZipInputStream(FileInputStream(zipFile)).use { zis ->
                          var entry = zis.nextEntry
                          var count = 0
                          val buffer = ByteArray(65536)
                          while (entry != null) {
                              val newFile = File(targetDir, entry.name)
                              if (entry.isDirectory) {
                                  newFile.mkdirs()
                              } else {
                                  newFile.parentFile?.mkdirs()
                                  FileOutputStream(newFile).use { fos ->
                                      var len: Int
                                      while (zis.read(buffer).also { len = it } > 0) {
                                          fos.write(buffer, 0, len)
                                      }
                                  }
                                  count++
                                  if (count % 5 == 0 || newFile.name.contains("uasset")) {
                                      callback.onLog("📁 [OBB] Extracted: ${entry.name}")
                                  }
                              }
                              zis.closeEntry()
                              entry = zis.nextEntry
                          }
                          callback.onLog("[SUCCESS] OBB unpacked total $count files.")
                          return true
                      }
                  } catch (e: Exception) {
                      callback.onLog("[ERROR] OBB extract error: ${e.message}")
                      return false
                  }
              }

              suspend fun replaceAndRepack(folderName: String, callback: TerminalCallback): Boolean = withContext(Dispatchers.IO) {
                  val unpackedFolder = File(dirUnpack, folderName)
                  if (!unpackedFolder.exists()) {
                      callback.onLog("[ERROR] Unpacked directory not found: $folderName")
                      return@withContext false
                  }

                  callback.onLog("[REPLACE] Checking Editor folder for modifications...")
                  var replacedCount = 0
                  dirEditor.listFiles()?.forEach { editorFile ->
                      unpackedFolder.walkTopDown().forEach { fileInTree ->
                          if (fileInTree.name.equals(editorFile.name, ignoreCase = true)) {
                              editorFile.copyTo(fileInTree, overwrite = true)
                              replacedCount++
                              callback.onLog("🔄 [REPLACED] ${editorFile.name} -> ${fileInTree.relativeTo(unpackedFolder).path}")
                          }
                      }
                  }

                  callback.onLog("[INFO] Total replaced files: $replacedCount")
                  val outputPak = File(dirRepack, "$folderName.pak")
                  nativeRepackPak(unpackedFolder.absolutePath, outputPak.absolutePath, callback)
              }
          }
          EOF

          # 10. MainActivity.kt (UI with Picker, Terminal Screen & Action Buttons)
          cat << 'EOF' > app/src/main/java/com/upstool/paktool/MainActivity.kt
          package com.upstool.paktool

          import android.content.Intent
          import android.net.Uri
          import android.os.Build
          import android.os.Bundle
          import android.os.Environment
          import android.provider.Settings
          import androidx.activity.ComponentActivity
          import androidx.activity.compose.setContent
          import androidx.compose.foundation.background
          import androidx.compose.foundation.border
          import androidx.compose.foundation.clickable
          import androidx.compose.foundation.layout.*
          import androidx.compose.foundation.lazy.LazyColumn
          import androidx.compose.foundation.lazy.items
          import androidx.compose.foundation.lazy.rememberLazyListState
          import androidx.compose.foundation.shape.RoundedCornerShape
          import androidx.compose.material.icons.Icons
          import androidx.compose.material.icons.filled.ArrowDropDown
          import androidx.compose.material.icons.filled.Refresh
          import androidx.compose.material.icons.filled.Warning
          import androidx.compose.material3.*
          import androidx.compose.runtime.*
          import androidx.compose.ui.Alignment
          import androidx.compose.ui.Modifier
          import androidx.compose.ui.graphics.Color
          import androidx.compose.ui.platform.LocalContext
          import androidx.compose.ui.text.font.FontFamily
          import androidx.compose.ui.text.font.FontWeight
          import androidx.compose.ui.unit.dp
          import androidx.compose.ui.unit.sp
          import kotlinx.coroutines.launch
          import java.io.File

          class MainActivity : ComponentActivity() {
              override fun onCreate(savedInstanceState: Bundle?) {
                  super.onCreate(savedInstanceState)
                  setContent {
                      MaterialTheme(colorScheme = darkColorScheme()) {
                          Surface(modifier = Modifier.fillMaxSize(), color = Color(0xFF0A0A0A)) {
                              TerminalUnpackerScreen()
                          }
                      }
                  }
              }
          }

          @OptIn(ExperimentalMaterial3Api::class)
          @Composable
          fun TerminalUnpackerScreen() {
              val context = LocalContext.current
              val scope = rememberCoroutineScope()
              val listState = rememberLazyListState()

              var originalFiles by remember { mutableStateOf<List<File>>(emptyList()) }
              var selectedFile by remember { mutableStateOf<File?>(null) }
              var unpackedFolders by remember { mutableStateOf<List<String>>(emptyList()) }
              var selectedUnpackFolder by remember { mutableStateOf("") }

              var terminalLogs by remember { mutableStateOf<List<String>>(listOf("[SYSTEM] Upstool Pak Engine Initialized.")) }
              var isBusy by remember { mutableStateOf(false) }

              var showOriginalDropdown by remember { mutableStateOf(false) }
              var showRepackDropdown by remember { mutableStateOf(false) }

              fun addLog(msg: String) {
                  terminalLogs = terminalLogs + msg
              }

              fun refreshFiles() {
                  val originals = PakEngine.dirOriginal.listFiles()
                      ?.filter { it.isFile && (it.extension in listOf("pak", "obb") || it.name.contains("patch")) }
                      ?.toList() ?: emptyList()
                  originalFiles = originals
                  if (selectedFile == null && originals.isNotEmpty()) {
                      selectedFile = originals.first()
                  }

                  val unp = PakEngine.dirUnpack.listFiles()?.filter { it.isDirectory }?.map { it.name } ?: emptyList()
                  unpackedFolders = unp
                  if (selectedUnpackFolder.isEmpty() && unp.isNotEmpty()) {
                      selectedUnpackFolder = unp.first()
                  }
              }

              LaunchedEffect(Unit) {
                  refreshFiles()
              }

              // Auto-scroll terminal to bottom when new logs arrive
              LaunchedEffect(terminalLogs.size) {
                  if (terminalLogs.isNotEmpty()) {
                      listState.animateScrollToItem(terminalLogs.size - 1)
                  }
              }

              val hasStoragePermission = remember {
                  derivedStateOf {
                      if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.R) {
                          Environment.isExternalStorageManager()
                      } else true
                  }
              }

              val callback = remember {
                  object : TerminalCallback {
                      override fun onLog(line: String) {
                          scope.launch { addLog(line) }
                      }
                  }
              }

              Scaffold(
                  topBar = {
                      TopAppBar(
                          title = { Text("UPSTOOL PAK ENGINE", fontWeight = FontWeight.Bold, letterSpacing = 1.sp) },
                          actions = {
                              IconButton(onClick = { refreshFiles(); addLog("[STATUS] Storage refreshed.") }, enabled = !isBusy) {
                                  Icon(Icons.Default.Refresh, contentDescription = "Refresh", tint = Color(0xFF00E5FF))
                              }
                          },
                          colors = TopAppBarDefaults.topAppBarColors(containerColor = Color(0xFF141414))
                      )
                  },
                  containerColor = Color(0xFF0A0A0A)
              ) { padding ->
                  Column(
                      modifier = Modifier
                          .fillMaxSize()
                          .padding(padding)
                          .padding(14.dp),
                      verticalArrangement = Arrangement.spacedBy(10.dp)
                  ) {
                      // Permission Warning
                      if (!hasStoragePermission.value && Build.VERSION.SDK_INT >= Build.VERSION_CODES.R) {
                          Card(colors = CardDefaults.cardColors(containerColor = Color(0xFF3B1212))) {
                              Row(modifier = Modifier.padding(10.dp), verticalAlignment = Alignment.CenterVertically) {
                                  Icon(Icons.Default.Warning, contentDescription = null, tint = Color(0xFFFF5252))
                                  Spacer(modifier = Modifier.width(8.dp))
                                  Text("All Files Access Required", color = Color.White, fontSize = 12.sp, modifier = Modifier.weight(1f))
                                  Button(
                                      onClick = {
                                          val intent = Intent(Settings.ACTION_MANAGE_APP_ALL_FILES_ACCESS_PERMISSION).apply {
                                              data = Uri.parse("package:${context.packageName}")
                                          }
                                          context.startActivity(intent)
                                      },
                                      colors = ButtonDefaults.buttonColors(containerColor = Color(0xFFFF5252))
                                  ) { Text("Allow", fontSize = 11.sp) }
                              }
                          }
                      }

                      // Selection Header (Choose PAK/OBB)
                      Card(
                          modifier = Modifier.fillMaxWidth(),
                          colors = CardDefaults.cardColors(containerColor = Color(0xFF181818)),
                          shape = RoundedCornerShape(8.dp)
                      ) {
                          Column(modifier = Modifier.padding(12.dp)) {
                              Text("SELECT TARGET ARCHIVE (Original Folder):", color = Color.Gray, fontSize = 11.sp, fontWeight = FontWeight.Bold)
                              Spacer(modifier = Modifier.height(4.dp))
                              Row(
                                  modifier = Modifier
                                      .fillMaxWidth()
                                      .background(Color(0xFF222222), RoundedCornerShape(6.dp))
                                      .clickable { showOriginalDropdown = true }
                                      .padding(horizontal = 12.dp, vertical = 10.dp),
                                  horizontalArrangement = Arrangement.SpaceBetween,
                                  verticalAlignment = Alignment.CenterVertically
                              ) {
                                  Text(
                                      text = selectedFile?.name ?: if (originalFiles.isEmpty()) "No .pak/.obb in /Original" else "Choose File",
                                      color = if (selectedFile != null) Color(0xFF00E5FF) else Color.LightGray,
                                      fontSize = 13.sp,
                                      fontFamily = FontFamily.Monospace,
                                      maxLines = 1
                                  )
                                  Icon(Icons.Default.ArrowDropDown, contentDescription = null, tint = Color.White)
                              }
                          }
                      }

                      // LIVE TERMINAL VIEW
                      Box(
                          modifier = Modifier
                              .fillMaxWidth()
                              .weight(1f)
                              .background(Color(0xFF000000), RoundedCornerShape(8.dp))
                              .border(1.dp, Color(0xFF242424), RoundedCornerShape(8.dp))
                              .padding(10.dp)
                      ) {
                          LazyColumn(
                              state = listState,
                              modifier = Modifier.fillMaxSize()
                          ) {
                              items(terminalLogs) { log ->
                                  val logColor = when {
                                      log.startsWith("[ERROR]") -> Color(0xFFFF5252)
                                      log.startsWith("[SUCCESS]") || log.startsWith("[FINISHED]") -> Color(0xFF00E676)
                                      log.startsWith("[INIT]") || log.startsWith("[INDEX]") -> Color(0xFF00E5FF)
                                      log.startsWith("📁") -> Color(0xFFFFD54F)
                                      log.startsWith("📦") || log.startsWith("🔄") -> Color(0xFF80D8FF)
                                      else -> Color(0xFFE0E0E0)
                                  }
                                  Text(
                                      text = log,
                                      color = logColor,
                                      fontSize = 11.sp,
                                      fontFamily = FontFamily.Monospace,
                                      lineHeight = 15.sp
                                  )
                              }
                          }
                      }

                      // UNPACK & REPACK ACTION BUTTONS
                      Row(
                          modifier = Modifier.fillMaxWidth(),
                          horizontalArrangement = Arrangement.spacedBy(10.dp)
                      ) {
                          Button(
                              onClick = {
                                  selectedFile?.let { target ->
                                      isBusy = true
                                      addLog("[START] Preparing unpack: ${target.name}")
                                      scope.launch {
                                          val ok = PakEngine.unpackArchive(target, callback)
                                          refreshFiles()
                                          isBusy = false
                                          addLog(if (ok) "[COMPLETE] Unpacked into /sdcard/Upstool/Unpack/${target.nameWithoutExtension}" else "[FAILED] Unpack operation failed.")
                                      }
                                  }
                              },
                              enabled = !isBusy && selectedFile != null,
                              modifier = Modifier.weight(1f).height(50.dp),
                              shape = RoundedCornerShape(8.dp),
                              colors = ButtonDefaults.buttonColors(containerColor = Color(0xFF0288D1))
                          ) {
                              Text("UNPACK TO TREE", fontWeight = FontWeight.Bold)
                          }

                          Button(
                              onClick = { showRepackDropdown = true },
                              enabled = !isBusy && unpackedFolders.isNotEmpty(),
                              modifier = Modifier.weight(1f).height(50.dp),
                              shape = RoundedCornerShape(8.dp),
                              colors = ButtonDefaults.buttonColors(containerColor = Color(0xFF00C853))
                          ) {
                              Text("REPACK CHOSEN", fontWeight = FontWeight.Bold)
                          }
                      }
                  }
              }

              // Dropdown Dialog for Original Pak Chooser
              if (showOriginalDropdown) {
                  AlertDialog(
                      onDismissRequest = { showOriginalDropdown = false },
                      title = { Text("Select Archive to Unpack") },
                      text = {
                          LazyColumn(modifier = Modifier.fillMaxWidth().heightIn(max = 280.dp)) {
                              items(originalFiles) { file ->
                                  Text(
                                      text = file.name,
                                      modifier = Modifier
                                          .fillMaxWidth()
                                          .clickable {
                                              selectedFile = file
                                              showOriginalDropdown = false
                                              addLog("[SELECTED] ${file.name}")
                                          }
                                          .padding(vertical = 12.dp),
                                      fontSize = 13.sp,
                                      fontFamily = FontFamily.Monospace
                                  )
                              }
                          }
                      },
                      confirmButton = {},
                      dismissButton = { TextButton(onClick = { showOriginalDropdown = false }) { Text("Cancel") } }
                  )
              }

              // Dropdown Dialog for Repack Directory Chooser
              if (showRepackDropdown) {
                  AlertDialog(
                      onDismissRequest = { showRepackDropdown = false },
                      title = { Text("Select Folder to Replace & Repack") },
                      text = {
                          LazyColumn(modifier = Modifier.fillMaxWidth().heightIn(max = 280.dp)) {
                              items(unpackedFolders) { folderName ->
                                  Text(
                                      text = folderName,
                                      modifier = Modifier
                                          .fillMaxWidth()
                                          .clickable {
                                              showRepackDropdown = false
                                              isBusy = true
                                              addLog("[START] Repacking folder: $folderName")
                                              scope.launch {
                                                  val ok = PakEngine.replaceAndRepack(folderName, callback)
                                                  refreshFiles()
                                                  isBusy = false
                                                  addLog(if (ok) "[COMPLETE] Repacked -> /sdcard/Upstool/Repack/$folderName.pak" else "[FAILED] Repack failed.")
                                              }
                                          }
                                          .padding(vertical = 12.dp),
                                      fontSize = 13.sp,
                                      fontFamily = FontFamily.Monospace
                                  )
                              }
                          }
                      },
                      confirmButton = {},
                      dismissButton = { TextButton(onClick = { showRepackDropdown = false }) { Text("Cancel") } }
                  )
              }
          }
          EOF

      - name: Generate Official Gradle Wrapper 8.5
        run: |
          gradle wrapper --gradle-version 8.5 --distribution-type bin
          chmod +x gradlew

      - name: Commit and Push All Sources to Repository
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add .
          if git diff --staged --quiet; then
            echo "No new changes to commit."
          else
            git commit -m "Fix PAK engine, live terminal UI, and OBB support [skip ci]"
            git push origin HEAD:${{ github.ref_name }}
          fi

      - name: Install Android NDK and CMake
        run: |
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true
          $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --install "ndk;26.1.10909125" "cmake;3.22.1"

      - name: Build Debug APK
        run: ./gradlew assembleDebug --stacktrace

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Upstool-Debug-APK
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
