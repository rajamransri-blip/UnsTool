name: Setup Project and Build APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Python 3.10 for Chaquopy
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Generate Official Gradle 8.5 Wrapper Safely
        run: |
          TMP_DIR=$(mktemp -d)
          echo 'rootProject.name = "wrapper-init"' > "$TMP_DIR/settings.gradle"
          touch "$TMP_DIR/build.gradle"
          (cd "$TMP_DIR" && gradle wrapper --gradle-version 8.5 --distribution-type bin)
          mkdir -p gradle/wrapper
          cp "$TMP_DIR/gradlew" ./gradlew
          cp "$TMP_DIR/gradle/wrapper/gradle-wrapper.jar" ./gradle/wrapper/
          cp "$TMP_DIR/gradle/wrapper/gradle-wrapper.properties" ./gradle/wrapper/
          chmod +x ./gradlew
          rm -rf "$TMP_DIR"

      - name: Generate Complete Source Tree
        run: |
          mkdir -p app/src/main/cpp
          mkdir -p app/src/main/python
          mkdir -p app/src/main/java/com/upstool/paktool
          mkdir -p app/src/main/res/values

          # 1. gradle.properties (AndroidX + JVM Memory)
          cat << 'EOF' > gradle.properties
          org.gradle.jvmargs=-Xmx3072m -Dfile.encoding=UTF-8
          android.useAndroidX=true
          android.nonTransitiveRClass=true
          kotlin.code.style=official
          EOF

          # 2. settings.gradle
          cat << 'EOF' > settings.gradle
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
                  maven { url "https://chaquo.com/maven" }
              }
          }
          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.PREFER_SETTINGS)
              repositories {
                  google()
                  mavenCentral()
                  maven { url "https://chaquo.com/maven" }
              }
          }
          rootProject.name = "Upstool"
          include ':app'
          EOF

          # 3. Root build.gradle
          cat << 'EOF' > build.gradle
          buildscript {
              repositories {
                  google()
                  mavenCentral()
                  maven { url "https://chaquo.com/maven" }
              }
              dependencies {
                  classpath "com.android.tools.build:gradle:8.2.2"
                  classpath "org.jetbrains.kotlin:kotlin-gradle-plugin:1.9.22"
                  classpath "com.chaquo.python:gradle:15.0.1"
              }
          }
          EOF

          # 4. app/build.gradle (Chaquopy + PyCryptodome + Zstandard + NDK)
          cat << 'EOF' > app/build.gradle
          apply plugin: 'com.android.application'
          apply plugin: 'org.jetbrains.kotlin.android'
          apply plugin: 'com.chaquo.python'

          android {
              namespace 'com.upstool.paktool'
              compileSdk 34

              defaultConfig {
                  applicationId "com.upstool.paktool"
                  minSdk 24
                  targetSdk 34
                  versionCode 1
                  versionName "1.0.0"

                  ndk {
                      abiFilters "arm64-v8a", "armeabi-v7a"
                  }

                  python {
                      version "3.10"
                      pip {
                          install "pycryptodome"
                          install "zstandard"
                      }
                  }

                  externalNativeBuild {
                      cmake {
                          cppFlags "-std=c++17"
                          arguments "-DANDROID_STL=c++_shared"
                      }
                  }
              }

              buildTypes {
                  release {
                      minifyEnabled false
                      proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
                  }
              }

              compileOptions {
                  sourceCompatibility JavaVersion.VERSION_17
                  targetCompatibility JavaVersion.VERSION_17
              }

              kotlinOptions {
                  jvmTarget = '17'
              }

              buildFeatures {
                  compose true
              }

              composeOptions {
                  kotlinCompilerExtensionVersion '1.5.8'
              }

              externalNativeBuild {
                  cmake {
                      path file('src/main/cpp/CMakeLists.txt')
                      version '3.22.1'
                  }
              }

              ndkVersion '26.1.10909125'
          }

          dependencies {
              def composeBom = platform('androidx.compose:compose-bom:2024.02.00')
              implementation composeBom
              implementation 'androidx.core:core-ktx:1.12.0'
              implementation 'androidx.lifecycle:lifecycle-runtime-ktx:2.7.0'
              implementation 'androidx.activity:activity-compose:1.8.2'
              implementation 'androidx.lifecycle:lifecycle-viewmodel-compose:2.7.0'
              implementation 'androidx.compose.ui:ui'
              implementation 'androidx.compose.ui:ui-graphics'
              implementation 'androidx.compose.material3:material3'
              implementation 'androidx.compose.material:material-icons-extended'
              implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-android:1.7.3'
          }
          EOF

          touch app/proguard-rules.pro

          # 5. Strings Resource
          cat << 'EOF' > app/src/main/res/values/strings.xml
          <resources>
              <string name="app_name">Upstool</string>
          </resources>
          EOF

          # 6. AndroidManifest.xml
          cat << 'EOF' > app/src/main/AndroidManifest.xml
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android"
              xmlns:tools="http://schemas.android.com/tools">

              <uses-permission android:name="android.permission.READ_EXTERNAL_STORAGE" />
              <uses-permission android:name="android.permission.WRITE_EXTERNAL_STORAGE" />
              <uses-permission
                  android:name="android.permission.MANAGE_EXTERNAL_STORAGE"
                  tools:ignore="ScopedStorage" />

              <application
                  android:allowBackup="true"
                  android:label="@string/app_name"
                  android:requestLegacyExternalStorage="true"
                  android:supportsRtl="true"
                  android:theme="@android:style/Theme.Material.NoActionBar">
                  <activity
                      android:name=".MainActivity"
                      android:exported="true"
                      android:windowSoftInputMode="adjustResize">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>
              </application>
          </manifest>
          EOF

          # 7. CMakeLists.txt (Links zlib directly)
          cat << 'EOF' > app/src/main/cpp/CMakeLists.txt
          cmake_minimum_required(VERSION 3.22.1)
          project("upstool_native")

          set(CMAKE_CXX_STANDARD 17)

          add_library(upstool_native SHARED
              pak_engine.cpp
          )

          find_library(log-lib log)

          target_link_libraries(upstool_native
              ${log-lib}
              z
          )
          EOF

          # 8. C++ Deep Zlib Stream Carver Engine (pak_engine.cpp)
          cat << 'EOF' > app/src/main/cpp/pak_engine.cpp
          #include <jni.h>
          #include <string>
          #include <vector>
          #include <fstream>
          #include <filesystem>
          #include <algorithm>
          #include <cstdint>
          #include <zlib.h>
          #include <android/log.h>

          namespace fs = std::filesystem;

          #define LOG_TAG "UpstoolNative"
          #define LOGI(...) __android_log_print(ANDROID_LOG_INFO, LOG_TAG, __VA_ARGS__)
          #define LOGE(...) __android_log_print(ANDROID_LOG_ERROR, LOG_TAG, __VA_ARGS__)

          static void sendTerminalLog(JNIEnv* env, jobject callback, jmethodID logMethod, const std::string& msg) {
              if (callback && logMethod) {
                  jstring jmsg = env->NewStringUTF(msg.c_str());
                  env->CallVoidMethod(callback, logMethod, jmsg);
                  env->DeleteLocalRef(jmsg);
              }
          }

          static bool deepCarveStreams(
              JNIEnv* env,
              jobject jCallback,
              jmethodID logMethod,
              const std::string& pakPath,
              const std::string& outputDir
          ) {
              sendTerminalLog(env, jCallback, logMethod, "[NATIVE CARVER] Scanning Zlib stream markers in game patch...");

              std::ifstream file(pakPath, std::ios::binary);
              if (!file.is_open()) {
                  sendTerminalLog(env, jCallback, logMethod, "[ERROR] Cannot open archive file.");
                  return false;
              }

              file.seekg(0, std::ios::end);
              int64_t totalSize = file.tellg();
              file.seekg(0, std::ios::beg);

              const size_t bufferSize = 1024 * 1024 * 4; // 4MB Chunk
              std::vector<uint8_t> buffer(bufferSize);
              std::vector<uint8_t> decompBuffer(1024 * 1024 * 8); // 8MB unpack buffer

              int extractedCount = 0;
              int64_t currentOffset = 0;

              while (currentOffset < totalSize) {
                  file.seekg(currentOffset);
                  file.read(reinterpret_cast<char*>(buffer.data()), bufferSize);
                  std::streamsize bytesRead = file.gcount();
                  if (bytesRead < 4) break;

                  for (size_t i = 0; i < bytesRead - 4; ++i) {
                      if (buffer[i] == 0x78 && (buffer[i+1] == 0x9C || buffer[i+1] == 0xDA || buffer[i+1] == 0x01)) {
                          size_t available = bytesRead - i;
                          z_stream strm{};
                          strm.next_in = &buffer[i];
                          strm.avail_in = available;
                          strm.next_out = decompBuffer.data();
                          strm.avail_out = decompBuffer.size();

                          if (inflateInit(&strm) == Z_OK) {
                              int ret = inflate(&strm, Z_FINISH);
                              size_t decompressedSize = decompBuffer.size() - strm.avail_out;
                              inflateEnd(&strm);

                              if ((ret == Z_STREAM_END || ret == Z_OK) && decompressedSize > 64) {
                                  std::string contentStr(reinterpret_cast<char*>(decompBuffer.data()), std::min(decompressedSize, (size_t)2048));
                                  std::string relPath;

                                  if (contentStr.find("BP_PlayerPawn") != std::string::npos) {
                                      if (contentStr.find("uasset") != std::string::npos || decompBuffer[0] == 0xC1 || decompBuffer[3] == 0x9E) {
                                          relPath = "ShadowTrackerExtra/Saved/Paks/BP_PlayerPawn.uasset";
                                      } else {
                                          relPath = "ShadowTrackerExtra/Saved/Paks/BP_PlayerPawn.uexp";
                                      }
                                  } else if (contentStr.find("ShadowTrackerExtra") != std::string::npos) {
                                      size_t p = contentStr.find("ShadowTrackerExtra");
                                      size_t endP = contentStr.find_first_of("\0\r\n ", p);
                                      if (endP != std::string::npos && (endP - p) < 256) {
                                          relPath = contentStr.substr(p, endP - p);
                                      }
                                  }

                                  if (!relPath.empty()) {
                                      fs::path destPath = fs::path(outputDir) / relPath;
                                      fs::create_directories(destPath.parent_path());

                                      std::ofstream out(destPath, std::ios::binary);
                                      if (out.is_open()) {
                                          out.write(reinterpret_cast<char*>(decompBuffer.data()), decompressedSize);
                                          out.close();
                                          extractedCount++;
                                          sendTerminalLog(env, jCallback, logMethod, "📁 [CARVED] " + relPath);
                                      }
                                  }
                              }
                          }
                      }
                  }
                  currentOffset += (bufferSize - 65536);
              }

              sendTerminalLog(env, jCallback, logMethod, "[SUCCESS] Native Carver extracted " + std::to_string(extractedCount) + " files.");
              return extractedCount > 0;
          }

          extern "C" JNIEXPORT jboolean JNICALL
          Java_com_upstool_paktool_PakEngine_nativeUnpackDeep(
              JNIEnv* env,
              jobject,
              jstring jPakPath,
              jstring jOutputDir,
              jobject jCallback
          ) {
              jclass cbClass = env->GetObjectClass(jCallback);
              jmethodID logMethod = env->GetMethodID(cbClass, "onLog", "(Ljava/lang/String;)V");

              const char* cPakPath = env->GetStringUTFChars(jPakPath, nullptr);
              const char* cOutputDir = env->GetStringUTFChars(jOutputDir, nullptr);

              bool res = deepCarveStreams(env, jCallback, logMethod, cPakPath, cOutputDir);

              env->ReleaseStringUTFChars(jPakPath, cPakPath);
              env->ReleaseStringUTFChars(jOutputDir, cOutputDir);
              return res ? JNI_TRUE : JNI_FALSE;
          }
          EOF

          # 9. Python Core Module (pak_engine.py)
          cat << 'EOF' > app/src/main/python/pak_engine.py
          import os
          import sys
          import zlib
          import struct
          from pathlib import Path

          try:
              import zstandard as zstd
          except Exception:
              zstd = None

          def log(callback, text):
              if callback:
                  callback.onLog(str(text))

          def unpack_pak(pak_path, output_dir, callback):
              log(callback, f"[PYTHON] Reading archive: {os.path.basename(pak_path)}")
              os.makedirs(output_dir, exist_ok=True)
              
              extracted = 0
              file_size = os.path.getsize(pak_path)
              
              with open(pak_path, "rb") as f:
                  chunk_size = 1024 * 1024 * 4
                  offset = 0
                  
                  while offset < file_size:
                      f.seek(offset)
                      data = f.read(chunk_size)
                      if not data:
                          break
                          
                      pos = 0
                      while True:
                          idx = data.find(b"\x78\x9c", pos)
                          if idx == -1:
                              idx = data.find(b"\x78\xda", pos)
                          if idx == -1:
                              break
                              
                          stream_data = data[idx:idx + 1024 * 1024 * 2]
                          try:
                              decomp = zlib.decompress(stream_data)
                              if len(decomp) > 64:
                                  if b"BP_PlayerPawn" in decomp:
                                      if decomp.startswith(b"\x9e\x2a\x83\xc1") or b".uasset" in decomp:
                                          name = "ShadowTrackerExtra/Saved/Paks/BP_PlayerPawn.uasset"
                                      else:
                                          name = "ShadowTrackerExtra/Saved/Paks/BP_PlayerPawn.uexp"
                                          
                                      target_file = os.path.join(output_dir, name)
                                      os.makedirs(os.path.dirname(target_file), exist_ok=True)
                                      with open(target_file, "wb") as out_f:
                                          out_f.write(decomp)
                                      extracted += 1
                                      log(callback, f"📁 [FOUND] {name} ({len(decomp)} bytes)")
                                  
                                  elif b"ShadowTrackerExtra" in decomp:
                                      p_start = decomp.find(b"ShadowTrackerExtra")
                                      p_end = decomp.find(b"\x00", p_start)
                                      if p_end != -1 and (p_end - p_start) < 200:
                                          try:
                                              rel_name = decomp[p_start:p_end].decode("utf-8", errors="ignore")
                                              if "." in rel_name:
                                                  target_file = os.path.join(output_dir, rel_name)
                                                  os.makedirs(os.path.dirname(target_file), exist_ok=True)
                                                  with open(target_file, "wb") as out_f:
                                                      out_f.write(decomp)
                                                  extracted += 1
                                                  log(callback, f"📁 [TREE] {rel_name}")
                                          except Exception:
                                              pass
                          except Exception:
                              pass
                          pos = idx + 2
                          
                      offset += (chunk_size - 65536)

              if extracted > 0:
                  log(callback, f"[SUCCESS] Python extracted {extracted} target files.")
                  return True
              return False

          def repack_pak(source_dir, output_pak, callback):
              log(callback, f"[REPACK] Serializing tree from: {source_dir}")
              file_list = []
              for root, _, files in os.walk(source_dir):
                  for file in files:
                      full_path = os.path.join(root, file)
                      rel_path = os.path.relpath(full_path, source_dir).replace("\\", "/")
                      file_list.append((full_path, rel_path))

              with open(output_pak, "wb") as pak:
                  entries = []
                  for full_path, rel_path in file_list:
                      file_data = open(full_path, "rb").read()
                      offset = pak.tell()
                      size = len(file_data)
                      
                      pak.write(struct.pack("<QQQ", offset, size, size))
                      pak.write(struct.pack("<I", 0))
                      pak.write(b"\x00" * 20)
                      pak.write(struct.pack("<B", 0))
                      pak.write(struct.pack("<I", 0))
                      
                      pak.write(file_data)
                      entries.append((rel_path, offset, size))
                      log(callback, f"📦 [PACK] {rel_path}")

                  index_offset = pak.tell()
                  mount = "../../../\x00"
                  pak.write(struct.pack("<I", len(mount)))
                  pak.write(mount.encode("utf-8"))
                  pak.write(struct.pack("<I", len(entries)))

                  for rel_path, off, sz in entries:
                      p_bytes = rel_path.encode("utf-8") + b"\x00"
                      pak.write(struct.pack("<I", len(p_bytes)))
                      pak.write(p_bytes)
                      pak.write(struct.pack("<QQQI", off, sz, sz, 0))
                      pak.write(b"\x00" * 20)
                      pak.write(struct.pack("<BI", 0, 0))

                  index_size = pak.tell() - index_offset

                  pak.write(b"\x00" * 16)
                  pak.write(struct.pack("<B", 0))
                  pak.write(struct.pack("<I", 0x5A6F12E1))
                  pak.write(struct.pack("<I", 8))
                  pak.write(struct.pack("<Q", index_offset))
                  pak.write(struct.pack("<Q", index_size))
                  pak.write(b"\x00" * 20)

              log(callback, f"[FINISHED] Repacked {len(file_list)} files into {os.path.basename(output_pak)}")
              return True
          EOF

          # 10. PakEngine.kt
          cat << 'EOF' > app/src/main/java/com/upstool/paktool/PakEngine.kt
          package com.upstool.paktool

          import android.content.Context
          import android.os.Environment
          import com.chaquo.python.Python
          import com.chaquo.python.android.AndroidPlatform
          import kotlinx.coroutines.Dispatchers
          import kotlinx.coroutines.withContext
          import java.io.File

          interface TerminalCallback {
              fun onLog(line: String)
          }

          object PakEngine {
              init {
                  System.loadLibrary("upstool_native")
              }

              private external fun nativeUnpackDeep(pakPath: String, outputDir: String, callback: TerminalCallback): Boolean

              private val baseDir = File(Environment.getExternalStorageDirectory(), "Upstool")
              val dirOriginal = File(baseDir, "Original").apply { mkdirs() }
              val dirEditor   = File(baseDir, "Editor").apply { mkdirs() }
              val dirUnpack   = File(baseDir, "Unpack").apply { mkdirs() }
              val dirRepack   = File(baseDir, "Repack").apply { mkdirs() }

              fun initPython(context: Context) {
                  if (!Python.isStarted()) {
                      Python.start(AndroidPlatform(context.applicationContext))
                  }
              }

              suspend fun unpackArchive(file: File, callback: TerminalCallback): Boolean = withContext(Dispatchers.IO) {
                  val targetFolder = File(dirUnpack, file.nameWithoutExtension).apply { mkdirs() }

                  try {
                      val py = Python.getInstance()
                      val module = py.getModule("pak_engine")
                      val pyResult = module.callAttr("unpack_pak", file.absolutePath, targetFolder.absolutePath, callback).toBoolean()
                      if (pyResult) return@withContext true
                  } catch (e: Exception) {
                      callback.onLog("[PY] Handing over to Native Deep Carver...")
                  }

                  nativeUnpackDeep(file.absolutePath, targetFolder.absolutePath, callback)
              }

              suspend fun replaceAndRepack(folderName: String, callback: TerminalCallback): Boolean = withContext(Dispatchers.IO) {
                  val unpackedFolder = File(dirUnpack, folderName)
                  if (!unpackedFolder.exists()) {
                      callback.onLog("[ERROR] Directory not found: $folderName")
                      return@withContext false
                  }

                  callback.onLog("[REPLACE] Overwriting from Editor into hierarchy...")
                  var replacedCount = 0
                  dirEditor.listFiles()?.forEach { editorFile ->
                      unpackedFolder.walkTopDown().forEach { fileInTree ->
                          if (fileInTree.name.equals(editorFile.name, ignoreCase = true)) {
                              editorFile.copyTo(fileInTree, overwrite = true)
                              replacedCount++
                              callback.onLog("🔄 [REPLACED] ${editorFile.name}")
                          }
                      }
                  }
                  callback.onLog("[INFO] Total modified assets replaced: $replacedCount")

                  val outputPak = File(dirRepack, "$folderName.pak")
                  try {
                      val py = Python.getInstance()
                      val module = py.getModule("pak_engine")
                      return@withContext module.callAttr("repack_pak", unpackedFolder.absolutePath, outputPak.absolutePath, callback).toBoolean()
                  } catch (e: Exception) {
                      callback.onLog("[REPACK ERROR] ${e.message}")
                      return@withContext false
                  }
              }
          }
          EOF

          # 11. MainActivity.kt (UI Screen)
          cat << 'EOF' > app/src/main/java/com/upstool/paktool/MainActivity.kt
          package com.upstool.paktool

          import android.content.Intent
          import android.net.Uri
          import android.os.Build
          import android.os.Bundle
          import android.os.Environment
          import android.provider.Settings
          import androidx.activity.ComponentActivity
          import androidx.activity.compose.setContent
          import androidx.compose.foundation.background
          import androidx.compose.foundation.border
          import androidx.compose.foundation.clickable
          import androidx.compose.foundation.layout.*
          import androidx.compose.foundation.lazy.LazyColumn
          import androidx.compose.foundation.lazy.items
          import androidx.compose.foundation.lazy.rememberLazyListState
          import androidx.compose.foundation.shape.RoundedCornerShape
          import androidx.compose.material.icons.Icons
          import androidx.compose.material.icons.filled.ArrowDropDown
          import androidx.compose.material.icons.filled.Refresh
          import androidx.compose.material.icons.filled.Warning
          import androidx.compose.material3.*
          import androidx.compose.runtime.*
          import androidx.compose.ui.Alignment
          import androidx.compose.ui.Modifier
          import androidx.compose.ui.graphics.Color
          import androidx.compose.ui.platform.LocalContext
          import androidx.compose.ui.text.font.FontFamily
          import androidx.compose.ui.text.font.FontWeight
          import androidx.compose.ui.unit.dp
          import androidx.compose.ui.unit.sp
          import kotlinx.coroutines.launch
          import java.io.File

          class MainActivity : ComponentActivity() {
              override fun onCreate(savedInstanceState: Bundle?) {
                  super.onCreate(savedInstanceState)
                  PakEngine.initPython(applicationContext)

                  setContent {
                      MaterialTheme(colorScheme = darkColorScheme()) {
                          Surface(modifier = Modifier.fillMaxSize(), color = Color(0xFF0A0A0A)) {
                              TerminalUnpackerScreen()
                          }
                      }
                  }
              }
          }

          @OptIn(ExperimentalMaterial3Api::class)
          @Composable
          fun TerminalUnpackerScreen() {
              val context = LocalContext.current
              val scope = rememberCoroutineScope()
              val listState = rememberLazyListState()

              var originalFiles by remember { mutableStateOf<List<File>>(emptyList()) }
              var selectedFile by remember { mutableStateOf<File?>(null) }
              var unpackedFolders by remember { mutableStateOf<List<String>>(emptyList()) }

              var terminalLogs by remember { mutableStateOf<List<String>>(listOf("[SYSTEM] Upstool Python & Native Zlib Engines Loaded.")) }
              var isBusy by remember { mutableStateOf(false) }

              var showOriginalDropdown by remember { mutableStateOf(false) }
              var showRepackDropdown by remember { mutableStateOf(false) }

              fun addLog(msg: String) {
                  terminalLogs = terminalLogs + msg
              }

              fun refreshFiles() {
                  val originals = PakEngine.dirOriginal.listFiles()
                      ?.filter { it.isFile && (it.extension in listOf("pak", "obb") || it.name.contains("patch")) }
                      ?.toList() ?: emptyList()
                  originalFiles = originals
                  if (selectedFile == null && originals.isNotEmpty()) {
                      selectedFile = originals.first()
                  }

                  val unp = PakEngine.dirUnpack.listFiles()?.filter { it.isDirectory }?.map { it.name } ?: emptyList()
                  unpackedFolders = unp
              }

              LaunchedEffect(Unit) {
                  refreshFiles()
              }

              LaunchedEffect(terminalLogs.size) {
                  if (terminalLogs.isNotEmpty()) {
                      listState.animateScrollToItem(terminalLogs.size - 1)
                  }
              }

              val hasStoragePermission = remember {
                  derivedStateOf {
                      if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.R) {
                          Environment.isExternalStorageManager()
                      } else true
                  }
              }

              val callback = remember {
                  object : TerminalCallback {
                      override fun onLog(line: String) {
                          scope.launch { addLog(line) }
                      }
                  }
              }

              Scaffold(
                  topBar = {
                      TopAppBar(
                          title = { Text("UPSTOOL PAK ENGINE", fontWeight = FontWeight.Bold, letterSpacing = 1.sp) },
                          actions = {
                              IconButton(onClick = { refreshFiles(); addLog("[STATUS] Storage refreshed.") }, enabled = !isBusy) {
                                  Icon(Icons.Default.Refresh, contentDescription = "Refresh", tint = Color(0xFF00E5FF))
                              }
                          },
                          colors = TopAppBarDefaults.topAppBarColors(containerColor = Color(0xFF141414))
                      )
                  },
                  containerColor = Color(0xFF0A0A0A)
              ) { padding ->
                  Column(
                      modifier = Modifier
                          .fillMaxSize()
                          .padding(padding)
                          .padding(14.dp),
                      verticalArrangement = Arrangement.spacedBy(10.dp)
                  ) {
                      if (!hasStoragePermission.value && Build.VERSION.SDK_INT >= Build.VERSION_CODES.R) {
                          Card(colors = CardDefaults.cardColors(containerColor = Color(0xFF3B1212))) {
                              Row(modifier = Modifier.padding(10.dp), verticalAlignment = Alignment.CenterVertically) {
                                  Icon(Icons.Default.Warning, contentDescription = null, tint = Color(0xFFFF5252))
                                  Spacer(modifier = Modifier.width(8.dp))
                                  Text("All Files Access Required", color = Color.White, fontSize = 12.sp, modifier = Modifier.weight(1f))
                                  Button(
                                      onClick = {
                                          val intent = Intent(Settings.ACTION_MANAGE_APP_ALL_FILES_ACCESS_PERMISSION).apply {
                                              data = Uri.parse("package:${context.packageName}")
                                          }
                                          context.startActivity(intent)
                                      },
                                      colors = ButtonDefaults.buttonColors(containerColor = Color(0xFFFF5252))
                                  ) { Text("Allow", fontSize = 11.sp) }
                              }
                          }
                      }

                      Card(
                          modifier = Modifier.fillMaxWidth(),
                          colors = CardDefaults.cardColors(containerColor = Color(0xFF181818)),
                          shape = RoundedCornerShape(8.dp)
                      ) {
                          Column(modifier = Modifier.padding(12.dp)) {
                              Text("SELECT TARGET ARCHIVE (Original Folder):", color = Color.Gray, fontSize = 11.sp, fontWeight = FontWeight.Bold)
                              Spacer(modifier = Modifier.height(4.dp))
                              Row(
                                  modifier = Modifier
                                      .fillMaxWidth()
                                      .background(Color(0xFF222222), RoundedCornerShape(6.dp))
                                      .clickable { showOriginalDropdown = true }
                                      .padding(horizontal = 12.dp, vertical = 10.dp),
                                  horizontalArrangement = Arrangement.SpaceBetween,
                                  verticalAlignment = Alignment.CenterVertically
                              ) {
                                  Text(
                                      text = selectedFile?.name ?: if (originalFiles.isEmpty()) "No .pak/.obb in /Original" else "Choose File",
                                      color = if (selectedFile != null) Color(0xFF00E5FF) else Color.LightGray,
                                      fontSize = 13.sp,
                                      fontFamily = FontFamily.Monospace,
                                      maxLines = 1
                                  )
                                  Icon(Icons.Default.ArrowDropDown, contentDescription = null, tint = Color.White)
                              }
                          }
                      }

                      Box(
                          modifier = Modifier
                              .fillMaxWidth()
                              .weight(1f)
                              .background(Color(0xFF000000), RoundedCornerShape(8.dp))
                              .border(1.dp, Color(0xFF242424), RoundedCornerShape(8.dp))
                              .padding(10.dp)
                      ) {
                          LazyColumn(
                              state = listState,
                              modifier = Modifier.fillMaxSize()
                          ) {
                              items(terminalLogs) { log ->
                                  val logColor = when {
                                      log.startsWith("[ERROR]") || log.startsWith("[PY ERROR]") || log.startsWith("[REPACK ERROR]") -> Color(0xFFFF5252)
                                      log.startsWith("[SUCCESS]") || log.startsWith("[FINISHED]") -> Color(0xFF00E676)
                                      log.startsWith("[WARN]") || log.startsWith("[PY]") -> Color(0xFFFFB74D)
                                      log.startsWith("📁") -> Color(0xFFFFD54F)
                                      log.startsWith("📦") || log.startsWith("🔄") -> Color(0xFF80D8FF)
                                      else -> Color(0xFFE0E0E0)
                                  }
                                  Text(
                                      text = log,
                                      color = logColor,
                                      fontSize = 11.sp,
                                      fontFamily = FontFamily.Monospace,
                                      lineHeight = 15.sp
                                  )
                              }
                          }
                      }

                      Row(
                          modifier = Modifier.fillMaxWidth(),
                          horizontalArrangement = Arrangement.spacedBy(10.dp)
                      ) {
                          Button(
                              onClick = {
                                  selectedFile?.let { target ->
                                      isBusy = true
                                      addLog("[START] Processing: ${target.name}")
                                      scope.launch {
                                          val ok = PakEngine.unpackArchive(target, callback)
                                          refreshFiles()
                                          isBusy = false
                                          addLog(if (ok) "[COMPLETE] Unpacked into /sdcard/Upstool/Unpack/${target.nameWithoutExtension}" else "[FAILED] Extraction failed.")
                                      }
                                  }
                              },
                              enabled = !isBusy && selectedFile != null,
                              modifier = Modifier.weight(1f).height(50.dp),
                              shape = RoundedCornerShape(8.dp),
                              colors = ButtonDefaults.buttonColors(containerColor = Color(0xFF0288D1))
                          ) {
                              Text("UNPACK TO TREE", fontWeight = FontWeight.Bold)
                          }

                          Button(
                              onClick = { showRepackDropdown = true },
                              enabled = !isBusy && unpackedFolders.isNotEmpty(),
                              modifier = Modifier.weight(1f).height(50.dp),
                              shape = RoundedCornerShape(8.dp),
                              colors = ButtonDefaults.buttonColors(containerColor = Color(0xFF00C853))
                          ) {
                              Text("REPACK CHOSEN", fontWeight = FontWeight.Bold)
                          }
                      }
                  }
              }

              if (showOriginalDropdown) {
                  AlertDialog(
                      onDismissRequest = { showOriginalDropdown = false },
                      title = { Text("Select Archive to Unpack") },
                      text = {
                          LazyColumn(modifier = Modifier.fillMaxWidth().heightIn(max = 280.dp)) {
                              items(originalFiles) { file ->
                                  Text(
                                      text = file.name,
                                      modifier = Modifier
                                          .fillMaxWidth()
                                          .clickable {
                                              selectedFile = file
                                              showOriginalDropdown = false
                                              addLog("[SELECTED] ${file.name}")
                                          }
                                          .padding(vertical = 12.dp),
                                      fontSize = 13.sp,
                                      fontFamily = FontFamily.Monospace
                                  )
                              }
                          }
                      },
                      confirmButton = {},
                      dismissButton = { TextButton(onClick = { showOriginalDropdown = false }) { Text("Cancel") } }
                  )
              }

              if (showRepackDropdown) {
                  AlertDialog(
                      onDismissRequest = { showRepackDropdown = false },
                      title = { Text("Select Folder to Replace & Repack") },
                      text = {
                          LazyColumn(modifier = Modifier.fillMaxWidth().heightIn(max = 280.dp)) {
                              items(unpackedFolders) { folderName ->
                                  Text(
                                      text = folderName,
                                      modifier = Modifier
                                          .fillMaxWidth()
                                          .clickable {
                                              showRepackDropdown = false
                                              isBusy = true
                                              addLog("[START] Repacking: $folderName")
                                              scope.launch {
                                                  val ok = PakEngine.replaceAndRepack(folderName, callback)
                                                  refreshFiles()
                                                  isBusy = false
                                                  addLog(if (ok) "[COMPLETE] Repacked -> /sdcard/Upstool/Repack/$folderName.pak" else "[FAILED] Repack failed.")
                                              }
                                          }
                                          .padding(vertical = 12.dp),
                                      fontSize = 13.sp,
                                      fontFamily = FontFamily.Monospace
                                  )
                              }
                          }
                      },
                      confirmButton = {},
                      dismissButton = { TextButton(onClick = { showRepackDropdown = false }) { Text("Cancel") } }
                  )
              }
          }
          EOF

      - name: Commit and Push All Sources to Repository
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add .
          if git diff --staged --quiet; then
            echo "No new changes to commit."
          else
            git commit -m "Auto-generate full Upstool source tree [skip ci]"
            git push origin HEAD:${{ github.ref_name }}
          fi

      - name: Install Android NDK and CMake
        run: |
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true
          $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --install "ndk;26.1.10909125" "cmake;3.22.1"

      - name: Build Debug APK with Gradle 8.5
        run: ./gradlew assembleDebug --stacktrace

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Upstool-Debug-APK
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
