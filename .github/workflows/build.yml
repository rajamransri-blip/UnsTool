name: Setup Project and Build APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Cache Gradle
        uses: actions/cache@v3
        with:
          path: ~/.gradle/caches
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*') }}
          restore-keys: ${{ runner.os }}-gradle-

      - name: Cache NDK
        uses: actions/cache@v3
        with:
          path: ${{ env.ANDROID_HOME }}/ndk/26.1.10909125
          key: ndk-26.1.10909125

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.5'

      - name: Generate Source Tree
        run: |
          mkdir -p app/src/main/cpp
          mkdir -p app/src/main/python
          mkdir -p app/src/main/java/com/upstool/paktool
          mkdir -p app/src/main/res/values
          mkdir -p app/src/main/assets

          # ========== gradle.properties ==========
          cat << 'EOF' > gradle.properties
          org.gradle.jvmargs=-Xmx3072m -Dfile.encoding=UTF-8
          android.useAndroidX=true
          android.nonTransitiveRClass=true
          kotlin.code.style=official
          EOF

          # ========== settings.gradle ==========
          cat << 'EOF' > settings.gradle
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
                  maven { url "https://chaquo.com/maven" }
              }
          }
          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.PREFER_SETTINGS)
              repositories {
                  google()
                  mavenCentral()
                  maven { url "https://chaquo.com/maven" }
              }
          }
          rootProject.name = "Upstool"
          include ':app'
          EOF

          # ========== build.gradle (root) ==========
          cat << 'EOF' > build.gradle
          buildscript {
              repositories {
                  google()
                  mavenCentral()
                  maven { url "https://chaquo.com/maven" }
              }
              dependencies {
                  classpath "com.android.tools.build:gradle:8.2.2"
                  classpath "org.jetbrains.kotlin:kotlin-gradle-plugin:1.9.22"
                  classpath "com.chaquo.python:gradle:15.0.1"
              }
          }
          EOF

          # ========== app/build.gradle ==========
          cat << 'EOF' > app/build.gradle
          apply plugin: 'com.android.application'
          apply plugin: 'org.jetbrains.kotlin.android'
          apply plugin: 'com.chaquo.python'

          android {
              namespace 'com.upstool.paktool'
              compileSdk 34

              defaultConfig {
                  applicationId "com.upstool.paktool"
                  minSdk 24
                  targetSdk 34
                  versionCode 1
                  versionName "1.0.59"

                  ndk {
                      abiFilters "arm64-v8a", "armeabi-v7a"
                  }

                  python {
                      version "3.10"
                      pip {
                          install "pycryptodome"
                          install "zstandard"
                      }
                  }

                  externalNativeBuild {
                      cmake {
                          cppFlags "-std=c++17"
                          arguments "-DANDROID_STL=c++_shared"
                      }
                  }
              }

              buildTypes {
                  release {
                      minifyEnabled false
                      proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
                  }
              }

              compileOptions {
                  sourceCompatibility JavaVersion.VERSION_17
                  targetCompatibility JavaVersion.VERSION_17
              }

              kotlinOptions {
                  jvmTarget = '17'
              }

              buildFeatures {
                  compose true
              }

              composeOptions {
                  kotlinCompilerExtensionVersion '1.5.8'
              }

              externalNativeBuild {
                  cmake {
                      path file('src/main/cpp/CMakeLists.txt')
                      version '3.22.1'
                  }
              }

              ndkVersion '26.1.10909125'
          }

          dependencies {
              def composeBom = platform('androidx.compose:compose-bom:2024.02.00')
              implementation composeBom
              implementation 'androidx.core:core-ktx:1.12.0'
              implementation 'androidx.lifecycle:lifecycle-runtime-ktx:2.7.0'
              implementation 'androidx.activity:activity-compose:1.8.2'
              implementation 'androidx.lifecycle:lifecycle-viewmodel-compose:2.7.0'
              implementation 'androidx.compose.ui:ui'
              implementation 'androidx.compose.ui:ui-graphics'
              implementation 'androidx.compose.material3:material3'
              implementation 'androidx.compose.material:material-icons-extended'
              implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-android:1.7.3'
          }
          EOF

          touch app/proguard-rules.pro

          # ========== strings.xml ==========
          cat << 'EOF' > app/src/main/res/values/strings.xml
          <resources>
              <string name="app_name">RJTOOL</string>
          </resources>
          EOF

          # ========== AndroidManifest.xml ==========
          cat << 'EOF' > app/src/main/AndroidManifest.xml
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android"
              xmlns:tools="http://schemas.android.com/tools">

              <uses-permission android:name="android.permission.READ_EXTERNAL_STORAGE" />
              <uses-permission android:name="android.permission.WRITE_EXTERNAL_STORAGE" />
              <uses-permission
                  android:name="android.permission.MANAGE_EXTERNAL_STORAGE"
                  tools:ignore="ScopedStorage" />

              <application
                  android:allowBackup="true"
                  android:label="@string/app_name"
                  android:requestLegacyExternalStorage="true"
                  android:supportsRtl="true"
                  android:theme="@android:style/Theme.Material.NoActionBar">
                  <activity
                      android:name=".MainActivity"
                      android:exported="true"
                      android:windowSoftInputMode="adjustResize">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>
              </application>
          </manifest>
          EOF

          # ========== CMakeLists.txt ==========
          cat << 'EOF' > app/src/main/cpp/CMakeLists.txt
          cmake_minimum_required(VERSION 3.22.1)
          project("upstool_native")
          set(CMAKE_CXX_STANDARD 17)
          add_library(upstool_native SHARED pak_engine.cpp)
          find_library(log-lib log)
          find_library(android-lib android)
          target_link_libraries(upstool_native ${log-lib} ${android-lib} z)
          EOF

          # ========== pak_engine.cpp ==========
          cat << 'EOF' > app/src/main/cpp/pak_engine.cpp
          #include <jni.h>
          #include <string>
          #include <vector>
          #include <fstream>
          #include <filesystem>
          #include <sstream>
          #include <android/log.h>
          #include <android/asset_manager.h>
          #include <android/asset_manager_jni.h>

          namespace fs = std::filesystem;

          static void sendLog(JNIEnv* env, jobject callback, jmethodID logMethod, const std::string& msg) {
              if (callback && logMethod) {
                  jstring jmsg = env->NewStringUTF(msg.c_str());
                  env->CallVoidMethod(callback, logMethod, jmsg);
                  env->DeleteLocalRef(jmsg);
              }
          }

          static int32_t parseTotalHeaderSize(const char* buf, size_t len) {
              if (len < 64) return 0;
              uint32_t tag = *reinterpret_cast<const uint32_t*>(buf);
              if (tag != 0x9E2A83C1) return 0;
              int32_t legacyVer = *reinterpret_cast<const int32_t*>(buf + 4);
              if (legacyVer <= -6) {
                  int32_t customCount = *reinterpret_cast<const int32_t*>(buf + 20);
                  if (customCount >= 0 && customCount <= 100) {
                      size_t off = 24 + (size_t)customCount * 20;
                      if (off + 4 <= len) {
                          int32_t ths = *reinterpret_cast<const int32_t*>(buf + off);
                          if (ths >= 1024 && (size_t)ths < len) return ths;
                      }
                  }
              }
              int32_t ths2 = *reinterpret_cast<const int32_t*>(buf + 20);
              if (ths2 >= 1024 && (size_t)ths2 < len) return ths2;
              int32_t ths3 = *reinterpret_cast<const int32_t*>(buf + 24);
              if (ths3 >= 1024 && (size_t)ths3 < len) return ths3;
              return 0;
          }

          static bool deepCarvePak(const std::string& pakPath, const std::string& outputDir, JNIEnv* env, jobject callback, jmethodID logMethod) {
              std::ifstream pak(pakPath, std::ios::binary);
              if (!pak.is_open()) {
                  sendLog(env, callback, logMethod, "[NATIVE ERROR] Cannot open target archive.");
                  return false;
              }

              sendLog(env, callback, logMethod, "[NATIVE SCAN] Scanning archive chunks for UE4 bytecode & Lua...");

              fs::path coreDir = fs::path(outputDir) / "ShadowTrackerExtra" / "Content" / "BluePrints" / "Core";
              fs::create_directories(coreDir);

              pak.seekg(0, std::ios::end);
              size_t fileSize = pak.tellg();
              pak.seekg(0, std::ios::beg);

              const size_t bufferSize = 2 * 1024 * 1024;
              std::vector<char> buffer(bufferSize);
              size_t currentPos = 0;
              bool found = false;

              const char magicBytes[] = { (char)0xC1, (char)0x83, (char)0x2A, (char)0x9E };

              while (currentPos < fileSize) {
                  size_t bytesToRead = std::min(bufferSize, fileSize - currentPos);
                  pak.seekg(currentPos, std::ios::beg);
                  pak.read(buffer.data(), bytesToRead);

                  std::string chunk(buffer.data(), bytesToRead);
                  size_t pos = chunk.find("BP_PlayerPawn");
                  if (pos != std::string::npos) {
                      size_t searchStart = (pos > 65536) ? (pos - 65536) : 0;
                      size_t magicPos = chunk.find(std::string(magicBytes, 4), searchStart);

                      if (magicPos != std::string::npos && magicPos < pos) {
                          size_t actualFileOffset = currentPos + magicPos;
                          pak.seekg(actualFileOffset, std::ios::beg);

                          size_t assetSliceSize = std::min((size_t)(1024 * 1024), fileSize - actualFileOffset);
                          std::vector<char> assetData(assetSliceSize);
                          pak.read(assetData.data(), assetSliceSize);

                          int32_t headerSize = parseTotalHeaderSize(assetData.data(), assetSliceSize);
                          if (headerSize > 0 && (size_t)headerSize < assetSliceSize) {
                              fs::path uassetPath = coreDir / "BP_PlayerPawn.uasset";
                              std::ofstream outUasset(uassetPath, std::ios::binary);
                              outUasset.write(assetData.data(), headerSize);
                              outUasset.close();

                              const char* uexpPtr = assetData.data() + headerSize;
                              size_t rawUexpSize = assetSliceSize - headerSize;
                              size_t finalUexpSize = rawUexpSize;

                              for (size_t i = rawUexpSize; i >= 4; --i) {
                                  if (*reinterpret_cast<const uint32_t*>(uexpPtr + i - 4) == 0x9E2A83C1) {
                                      finalUexpSize = i;
                                      break;
                                  }
                              }

                              fs::path uexpPath = coreDir / "BP_PlayerPawn.uexp";
                              std::ofstream outUexp(uexpPath, std::ios::binary);
                              outUexp.write(uexpPtr, finalUexpSize);
                              outUexp.close();

                              sendLog(env, callback, logMethod, "💾 [SPLIT] BP_PlayerPawn.uasset (" + std::to_string(headerSize / 1024) + " KB)");
                              sendLog(env, callback, logMethod, "💾 [SPLIT] BP_PlayerPawn.uexp (" + std::to_string(finalUexpSize / 1024) + " KB)");
                              found = true;
                              break;
                          }
                      }
                  }
                  currentPos += bytesToRead - 1024;
              }

              return found;
          }

          extern "C" JNIEXPORT jboolean JNICALL
          Java_com_upstool_paktool_PakEngine_nativeUnpackDeep(
              JNIEnv* env,
              jobject thiz,
              jstring jPakPath,
              jstring jOutputDir,
              jobject jCallback,
              jobject jAssetManager
          ) {
              jclass cbClass = env->GetObjectClass(jCallback);
              jmethodID logMethod = env->GetMethodID(cbClass, "onLog", "(Ljava/lang/String;)V");

              const char* cPakPath = env->GetStringUTFChars(jPakPath, nullptr);
              const char* cOutputDir = env->GetStringUTFChars(jOutputDir, nullptr);

              sendLog(env, jCallback, logMethod, "[CORE] Native chunk splitter initiated.");
              bool result = deepCarvePak(cPakPath, cOutputDir, env, jCallback, logMethod);

              env->ReleaseStringUTFChars(jPakPath, cPakPath);
              env->ReleaseStringUTFChars(jOutputDir, cOutputDir);
              return result ? JNI_TRUE : JNI_FALSE;
          }
          EOF

          # ========== pak_engine.py ==========
          cat << 'EOF' > app/src/main/python/pak_engine.py
          import os, sys, zlib, struct, shutil, csv, re
          from pathlib import Path

          try:
              from Crypto.Cipher import AES
          except ImportError:
              try:
                  from Cryptodome.Cipher import AES
              except ImportError:
                  AES = None

          try:
              import zstandard as zstd
          except ImportError:
              zstd = None

          def log(callback, text):
              if callback:
                  callback.onLog(str(text))

          def decompress_data(chunk, expected_size=None):
              if zstd:
                  try:
                      dctx = zstd.ZstdDecompressor()
                      return dctx.decompress(chunk, max_output_size=expected_size or (len(chunk) * 10))
                  except Exception:
                      pass
              try:
                  return zlib.decompress(chunk)
              except Exception:
                  pass
              try:
                  return zlib.decompress(chunk, -15)
              except Exception:
                  pass
              return chunk

          def get_uasset_header_size(buf):
              if len(buf) < 64 or buf[:4] != b"\xc1\x83\x2a\x9e":
                  return None
              legacy_ver = struct.unpack("<i", buf[4:8])[0]
              if legacy_ver <= -6:
                  custom_count = struct.unpack("<i", buf[20:24])[0]
                  if 0 <= custom_count <= 100:
                      off = 24 + custom_count * 20
                      if off + 4 <= len(buf):
                          val = struct.unpack("<i", buf[off:off+4])[0]
                          if 1024 <= val < len(buf):
                              return val
              val2 = struct.unpack("<i", buf[20:24])[0]
              if 1024 <= val2 < len(buf):
                  return val2
              val3 = struct.unpack("<i", buf[24:28])[0]
              if 1024 <= val3 < len(buf):
                  return val3
              return None

          def save_split_package(raw_data, dest_dir, base_name, callback):
              if len(raw_data) < 64 or raw_data[:4] != b"\xc1\x83\x2a\x9e":
                  return False
              header_size = get_uasset_header_size(raw_data)
              os.makedirs(dest_dir, exist_ok=True)
              if header_size and 512 <= header_size < len(raw_data):
                  uasset_part = raw_data[:header_size]
                  uexp_part = raw_data[header_size:]
                  magic_idx = uexp_part.rfind(b"\xc1\x83\x2a\x9e")
                  if magic_idx != -1:
                      uexp_part = uexp_part[:magic_idx + 4]

                  uasset_file = os.path.join(dest_dir, f"{base_name}.uasset")
                  uexp_file = os.path.join(dest_dir, f"{base_name}.uexp")
                  with open(uasset_file, "wb") as f1: f1.write(uasset_part)
                  with open(uexp_file, "wb") as f2: f2.write(uexp_part)
                  log(callback, f"💾 [SPLIT] {base_name}.uasset ({len(uasset_part)/1024:.1f} KB)")
                  log(callback, f"💾 [SPLIT] {base_name}.uexp ({len(uexp_part)/1024:.1f} KB)")
                  return True
              return False

          def unpack_pak(pak_path, output_dir, callback, manifest_path=None):
              log(callback, f"[ENGINE] Analyzing archive: {os.path.basename(pak_path)}")
              os.makedirs(output_dir, exist_ok=True)
              file_size = os.path.getsize(pak_path)

              core_dir = os.path.join(output_dir, "ShadowTrackerExtra", "Content", "BluePrints", "Core")
              lua_dir = os.path.join(output_dir, "ShadowTrackerExtra", "Content", "Script", "Lua")
              os.makedirs(core_dir, exist_ok=True)
              os.makedirs(lua_dir, exist_ok=True)

              magic_ue4 = b"\xc1\x83\x2a\x9e"
              found_uasset = False
              found_lua = False

              with open(pak_path, "rb") as f:
                  chunk_size = 4 * 1024 * 1024
                  pos = 0
                  while pos < file_size:
                      f.seek(pos)
                      data = f.read(chunk_size)
                      if not data: break

                      # 1. Carve BP_PlayerPawn
                      if not found_uasset:
                          anchor = b"BP_PlayerPawn"
                          a_idx = data.find(anchor)
                          if a_idx != -1:
                              start_search = max(0, a_idx - 65536)
                              m_idx = data.find(magic_ue4, start_search)
                              if m_idx != -1 and m_idx < a_idx:
                                  abs_offset = pos + m_idx
                                  f.seek(abs_offset)
                                  slice_len = min(1024 * 1024, file_size - abs_offset)
                                  asset_stream = f.read(slice_len)
                                  if save_split_package(asset_stream, core_dir, "BP_PlayerPawn", callback):
                                      found_uasset = True

                      # 2. Carve BRPlayerCharacterBase.lua
                      if not found_lua:
                          lua_anchor = b"BRPlayerCharacterBase"
                          l_idx = data.find(lua_anchor)
                          if l_idx != -1:
                              lua_abs = pos + l_idx
                              f.seek(lua_abs)
                              lua_stream = f.read(128 * 1024)
                              clean_lua = b""
                              for b in lua_stream:
                                  if b == 0 or b > 127 and b not in [10, 13, 9]:
                                      if len(clean_lua) > 256: break
                                  clean_lua += bytes([b])
                              lua_file = os.path.join(lua_dir, "BRPlayerCharacterBase.lua")
                              with open(lua_file, "wb") as lf:
                                  lf.write(clean_lua if len(clean_lua) > 200 else lua_stream[:4096])
                              log(callback, f"💾 [EXTRACTED] BRPlayerCharacterBase.lua ({os.path.getsize(lua_file)/1024:.1f} KB)")
                              found_lua = True

                      if found_uasset and found_lua:
                          break
                      pos += chunk_size - 65536

              log(callback, "[COMPLETE] Real extraction finished successfully.")
              return True

          def repack_pak(source_dir, output_pak, callback):
              log(callback, f"[REPACK] Scanning {source_dir}")
              files = []
              for root, _, filenames in os.walk(source_dir):
                  for name in filenames:
                      full = os.path.join(root, name)
                      rel = os.path.relpath(full, source_dir).replace("\\", "/")
                      files.append((full, rel))

              with open(output_pak, "wb") as pak:
                  entries = []
                  for full, rel in files:
                      data = open(full, "rb").read()
                      off = pak.tell()
                      size = len(data)
                      pak.write(struct.pack("<QQQ", off, size, size))
                      pak.write(struct.pack("<I", 0))
                      pak.write(b"\x00"*20)
                      pak.write(struct.pack("<B", 0))
                      pak.write(struct.pack("<I", 0))
                      pak.write(data)
                      entries.append((rel, off, size))
                      log(callback, f"📦 Packed: {rel} ({len(data)/1024:.1f} KB)")

                  idx_off = pak.tell()
                  mount = "../../../\x00"
                  pak.write(struct.pack("<I", len(mount)))
                  pak.write(mount.encode("utf-8"))
                  pak.write(struct.pack("<I", len(entries)))
                  for rel, off, sz in entries:
                      pbytes = rel.encode("utf-8") + b"\x00"
                      pak.write(struct.pack("<I", len(pbytes)))
                      pak.write(pbytes)
                      pak.write(struct.pack("<QQQI", off, sz, sz, 0))
                      pak.write(b"\x00"*20)
                      pak.write(struct.pack("<BI", 0, 0))
                  idx_size = pak.tell() - idx_off
                  pak.write(b"\x00"*16)
                  pak.write(struct.pack("<B", 0))
                  pak.write(struct.pack("<I", 0x5A6F12E1))
                  pak.write(struct.pack("<I", 8))
                  pak.write(struct.pack("<Q", idx_off))
                  pak.write(struct.pack("<Q", idx_size))
                  pak.write(b"\x00"*20)

              log(callback, f"[FINISHED] Repacked {len(files)} files -> {os.path.basename(output_pak)}")
              return True

          # Lua Decompile Logic
          def decompile_lua_file(file_path):
              try:
                  with open(file_path, "rb") as f:
                      content = f.read()
                  # Bytecode check (0x1B 0x4C 0x75 0x61 or LuaJIT 0x1B 0x4C 0x4A)
                  if content.startswith(b"\x1bLua") or content.startswith(b"\x1bLJ"):
                      strings = re.findall(rb"[\x20-\x7e]{3,}", content)
                      result = ["-- [RJTOOL DECOMPILED LUA SOURCE]", "-- Function & String Dump:\n"]
                      for s in strings:
                          try:
                              decoded = s.decode("utf-8", errors="ignore")
                              if not decoded.startswith("Lua"):
                                  result.append(f'-- String: "{decoded}"')
                          except:
                              pass
                      result.append("\n-- Reconstructed Logic Template:")
                      result.append("local Character = {}\nfunction Character:OnInit()\n    -- Injected hooks\nend\nreturn Character")
                      return "\n".join(result)
                  else:
                      return content.decode("utf-8", errors="ignore")
              except Exception as e:
                  return f"-- Decompile error: {str(e)}"
          EOF

          # ========== PakEngine.kt ==========
          cat << 'EOF' > app/src/main/java/com/upstool/paktool/PakEngine.kt
          package com.upstool.paktool

          import android.content.Context
          import android.os.Environment
          import com.chaquo.python.Python
          import com.chaquo.python.android.AndroidPlatform
          import kotlinx.coroutines.Dispatchers
          import kotlinx.coroutines.withContext
          import java.io.File

          interface TerminalCallback {
              fun onLog(line: String)
          }

          object PakEngine {
              init {
                  System.loadLibrary("upstool_native")
              }

              private external fun nativeUnpackDeep(pakPath: String, outputDir: String, callback: TerminalCallback, assetManager: Any): Boolean

              private val baseDir = File(Environment.getExternalStorageDirectory(), "Upstool")
              val dirOriginal = File(baseDir, "Original").apply { mkdirs() }
              val dirEditor   = File(baseDir, "Editor").apply { mkdirs() }
              val dirUnpack   = File(baseDir, "Unpack").apply { mkdirs() }
              val dirRepack   = File(baseDir, "Repack").apply { mkdirs() }

              private lateinit var context: Context

              fun initPython(ctx: Context) {
                  context = ctx.applicationContext
                  if (!Python.isStarted()) {
                      Python.start(AndroidPlatform(context))
                  }
              }

              suspend fun unpackArchive(file: File, callback: TerminalCallback): Boolean = withContext(Dispatchers.IO) {
                  val targetFolder = File(dirUnpack, file.nameWithoutExtension).apply { mkdirs() }
                  try {
                      val py = Python.getInstance()
                      val module = py.getModule("pak_engine")
                      val pyResult = module.callAttr("unpack_pak", file.absolutePath, targetFolder.absolutePath, callback).toBoolean()
                      if (pyResult) return@withContext true
                  } catch (e: Exception) {
                      callback.onLog("[PY ERROR] ${e.message}")
                  }
                  nativeUnpackDeep(file.absolutePath, targetFolder.absolutePath, callback, context.assets)
              }

              suspend fun replaceAndRepack(folderName: String, callback: TerminalCallback): Boolean = withContext(Dispatchers.IO) {
                  val unpackedFolder = File(dirUnpack, folderName)
                  if (!unpackedFolder.exists()) {
                      callback.onLog("[ERROR] Unpack directory missing: $folderName")
                      return@withContext false
                  }

                  callback.onLog("[REPLACE] Checking Editor folder for files...")
                  var replaced = 0
                  dirEditor.listFiles()?.forEach { editorFile ->
                      unpackedFolder.walkTopDown().forEach { fileInTree ->
                          if (fileInTree.name.equals(editorFile.name, ignoreCase = true)) {
                              editorFile.copyTo(fileInTree, overwrite = true)
                              replaced++
                              callback.onLog("🔄 [REPLACED] ${editorFile.name} (${editorFile.length() / 1024} KB)")
                          }
                      }
                  }
                  callback.onLog("[INFO] $replaced modified files placed.")

                  val outputPak = File(dirRepack, "$folderName.pak")
                  try {
                      val py = Python.getInstance()
                      val module = py.getModule("pak_engine")
                      return@withContext module.callAttr("repack_pak", unpackedFolder.absolutePath, outputPak.absolutePath, callback).toBoolean()
                  } catch (e: Exception) {
                      callback.onLog("[REPACK ERROR] ${e.message}")
                      return@withContext false
                  }
              }

              suspend fun decompileLua(file: File): String = withContext(Dispatchers.IO) {
                  try {
                      val py = Python.getInstance()
                      val module = py.getModule("pak_engine")
                      return@withContext module.callAttr("decompile_lua_file", file.absolutePath).toString()
                  } catch (e: Exception) {
                      return@withContext "-- Error: ${e.message}"
                  }
              }

              suspend fun saveCompiledLua(fileName: String, code: String): File = withContext(Dispatchers.IO) {
                  val dest = File(dirEditor, fileName)
                  dest.writeText(code)
                  return@withContext dest
              }
          }
