      - name: Commit and Push All Sources
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add .
          if git diff --staged --quiet; then
            echo "No new changes to commit."
          else
            git commit -m "Update UI to match dashboard screenshot with Lua decompiler and Hex editor [skip ci]"
            git push origin HEAD:${{ github.ref_name }}
          fi

      - name: Install NDK and CMake
        run: |
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true
          $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --install "ndk;26.1.10909125" "cmake;3.22.1"

      - name: Build Debug APK
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --stacktrace

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: RJTOOL-v1.0.59-Debug
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
